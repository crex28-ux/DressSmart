<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Luxury Colour Check</title>
<style>
  :root{
    color-scheme: light;
    --bg:#FAF8F4; --panel:#FFFFFF; --ink:#26241F; --ink-soft:#6E6A61;
    --ink-faint:#A49E93; --line:#E3DED4; --accent:#8A7659;
    --good:#5C7A5E; --warn:#A8873F; --bad:#9C5A50;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Helvetica Neue",-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;
    font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 28px 90px}
  header{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px;
    display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
  .htext{flex:1;min-width:280px}
  h1{font-family:Georgia,"Songti TC","Noto Serif TC",serif;font-weight:400;font-size:30px;
     letter-spacing:.01em;margin:0 0 6px}
  .sub{color:var(--ink-soft);font-size:13.5px;max-width:660px;margin:0}
  .langs{display:flex;gap:1px;border:1px solid var(--line);background:#fff}
  .langs button{appearance:none;border:none;background:none;font-family:inherit;font-size:12px;
    letter-spacing:.06em;padding:7px 11px;cursor:pointer;color:var(--ink-faint)}
  .langs button.on{background:var(--ink);color:#fff}
  .langs button:not(.on):hover{color:var(--ink)}
  .tabs{display:flex;gap:2px;margin-bottom:26px;border-bottom:1px solid var(--line)}
  .tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;
    padding:10px 18px;font-size:14px;color:var(--ink-soft);cursor:pointer;font-family:inherit;letter-spacing:.02em}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--line);padding:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"slots out" "pal out";
    gap:26px;align-items:start}
  .p-slots{grid-area:slots} .p-out{grid-area:out} .p-pal{grid-area:pal}
  .pal-note{font-size:11.5px;color:var(--ink-faint);line-height:1.5;margin:0 0 8px;max-width:480px}
  #mbar{display:none}
  h2{font-family:Georgia,"Songti TC",serif;font-weight:400;font-size:19px;margin:0 0 4px}
  h3{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 10px}
  .hint{font-size:12.5px;color:var(--ink-faint);margin:0 0 16px}
  .slots{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
  .slot{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);
    background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .slot:hover{border-color:var(--ink-faint)}
  .slot.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .chip{width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(0,0,0,.14);
    background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),
    linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);
    background-size:10px 10px;background-position:0 0,5px 5px}
  .slot-meta{flex:1;min-width:0}
  .slot-cat{font-size:13.5px}
  .slot-col{font-size:12px;color:var(--ink-soft)}
  .slot-opt{font-size:11px;color:var(--ink-faint)}
  select,input[type=text]{font-family:inherit;font-size:12.5px;padding:5px 7px;
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:0}
  .xbtn{appearance:none;border:none;background:none;color:var(--ink-faint);cursor:pointer;
    font-size:16px;line-height:1;padding:4px 6px;font-family:inherit}
  .xbtn:hover{color:var(--bad)}
  .pal-group{margin-bottom:14px}
  .pal-label{font-size:11px;letter-spacing:.09em;color:var(--ink-faint);margin-bottom:6px;text-transform:uppercase}
  .pal-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
  .sw{cursor:pointer;text-align:center}
  .sw i{display:block;height:44px;border:1px solid rgba(0,0,0,.13)}
  .sw:hover i{outline:1px solid var(--accent);outline-offset:1px}
  .sw span{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:3px;line-height:1.3}
  .look{border:1px solid var(--line);background:#fff}
  .look-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
  .look-row:last-child{border-bottom:none}
  .look-col{width:132px;flex:0 0 132px}
  .look-txt{padding:10px 14px;flex:1;min-width:0}
  .look-cat{font-size:11px;letter-spacing:.09em;color:var(--ink-faint);text-transform:uppercase}
  .look-name{font-size:14px}
  .look-num{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .score-head{display:flex;align-items:baseline;gap:14px;margin:22px 0 4px}
  .score-num{font-family:Georgia,serif;font-size:44px;line-height:1}
  .score-verdict{font-size:14px;letter-spacing:.04em}
  .rule{border-top:1px solid var(--line);padding:11px 0}
  .rule-top{display:flex;align-items:center;gap:9px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .rule-name{font-size:13px;flex:1}
  .rule-w{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .rule-txt{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0 16px}
  .fix{background:#F5F1E9;border-left:2px solid var(--accent);padding:12px 14px;margin-top:18px;font-size:13px}
  .fix b{font-weight:600;letter-spacing:.06em;font-size:11px;text-transform:uppercase;
    color:var(--accent);display:block;margin-bottom:4px}
  .notes{margin-top:14px;font-size:12.5px;color:var(--ink-soft)}
  .notes div{padding:3px 0}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .items{border-top:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .item i{width:26px;height:26px;flex:0 0 26px;border:1px solid rgba(0,0,0,.14)}
  .item .nm{flex:1;min-width:0}
  .item .fb{font-size:11.5px;color:var(--ink-faint)}
  button.act{appearance:none;font-family:inherit;font-size:13px;letter-spacing:.03em;
    background:var(--ink);color:#fff;border:1px solid var(--ink);padding:8px 18px;cursor:pointer}
  button.act:hover{background:#000}
  button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
  button.ghost:hover{background:#F4F1EB}
  .combo{border:1px solid var(--line);background:#fff;margin-bottom:10px}
  .combo-head{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
  .combo-bars{display:flex;flex:0 0 auto}
  .combo-bars i{width:30px;height:30px;border:1px solid rgba(0,0,0,.12);border-right:none}
  .combo-bars i:last-child{border-right:1px solid rgba(0,0,0,.12)}
  .combo-title{flex:1;min-width:0;font-size:13px}
  .combo-sc{font-family:Georgia,serif;font-size:20px;font-variant-numeric:tabular-nums}
  .combo-body{display:none;border-top:1px solid var(--line);padding:16px 14px}
  .combo.open .combo-body{display:block}
  .empty{color:var(--ink-faint);font-size:13px;padding:18px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
  details.method{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
  details.method summary{cursor:pointer;font-size:13px;color:var(--ink-soft)}
  details.method p{font-size:12.5px;color:var(--ink-soft);max-width:780px}
  .hide{display:none}

  /* ---------- style selector ---------- */
  .stylerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 20px}
  .stylab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .styles{display:flex;gap:1px;border:1px solid var(--line);background:#fff}
  .styles button{appearance:none;border:none;background:none;font-family:inherit;font-size:12.5px;
    padding:7px 13px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
  .styles button.on{background:var(--accent);color:#fff}
  .styles button:not(.on):hover{color:var(--ink)}
  .blurb{font-size:12px;color:var(--ink-faint);flex:1 1 300px;min-width:0;line-height:1.5}

  /* ---------- wardrobe ---------- */
  .wgrid{display:grid;grid-template-columns:1.1fr .9fr;
    grid-template-areas:"build list" "build gen" "out out";gap:22px;align-items:start}
  .p-build{grid-area:build} .p-list{grid-area:list} .p-gen{grid-area:gen}
  .wgrid .p-out{grid-area:out}
  .catpick,.modes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .catpick button,.modes button{appearance:none;font-family:inherit;font-size:12.5px;
    padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer}
  .catpick button:hover,.modes button:hover{border-color:var(--ink-faint);color:var(--ink)}
  .catpick button.on,.modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .catpick button .n{font-size:11px;opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
  .listhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .listhead h2{margin:0}
  .cnt{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .items{max-height:none}
  .item.off{opacity:.4}
  .item.pinned{box-shadow:inset 2px 0 0 var(--accent)}
  .item.pinned .nm{padding-left:7px}
  .ibtn{appearance:none;border:1px solid var(--line);background:#fff;font-family:inherit;
    font-size:10.5px;letter-spacing:.04em;padding:3px 7px;cursor:pointer;color:var(--ink-faint)}
  .ibtn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .ibtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .item select{font-size:11.5px;padding:3px 4px;max-width:112px}
  .dayslabel{font-size:12.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:7px}
  .dayslabel.hide{display:none}
  .pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:4px}
  .pkg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 9px;font-size:12.5px}
  .pkg i{width:22px;height:22px;flex:0 0 22px;border:1px solid rgba(0,0,0,.14)}
  .pkg span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wsec{margin-top:18px}
  .lowlist{margin-top:6px}
  .justadd{font-size:12px;color:var(--ink-soft);min-height:22px;margin:-4px 0 12px;
    display:flex;gap:8px;align-items:center}
  .justadd i{width:16px;height:16px;flex:0 0 16px;border:1px solid rgba(0,0,0,.14)}
  .justadd button{appearance:none;border:none;background:none;font-family:inherit;font-size:12px;
    color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
  .sw.added i{outline:2px solid var(--accent);outline-offset:1px}

  /* ---------- mobile ---------- */
  @media(max-width:880px){
    .wrap{padding:22px 15px 74px}
    header{gap:14px;padding-bottom:18px;margin-bottom:20px}
    h1{font-size:23px}
    .sub{font-size:12.5px}
    .langs{align-self:flex-start}
    .grid2{grid-template-columns:1fr;gap:16px}
    .qgrid{grid-template-columns:1fr;grid-template-areas:"slots" "out" "pal";gap:16px}
    .wgrid{grid-template-columns:1fr;grid-template-areas:"build" "list" "gen" "out";gap:16px}
    .stylerow{gap:8px;margin-bottom:14px}
    .styles{width:100%}
    .styles button{flex:1;padding:8px 6px;font-size:12px}
    .blurb{flex:1 1 100%;font-size:11.5px}
    .catpick button,.modes button{flex:1 1 auto;padding:8px 10px;font-size:12px}
    .item select{max-width:none;flex:1 1 92px}
    .pack{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
    .panel{padding:16px 14px}
    .tabs{margin-bottom:18px}
    .tab{padding:9px 12px;font-size:13px;flex:1}
    .pal-row{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
    .sw i{height:40px}
    .sw span{font-size:9.5px}
    .look-col{width:74px;flex:0 0 74px}
    .look-txt{padding:8px 10px}
    .score-num{font-size:36px}
    .slot{flex-wrap:wrap;gap:9px;padding:8px 10px}
    .slot-meta{flex:1 1 120px}
    .chip{width:36px;height:36px;flex:0 0 36px}
    select,input[type=text]{font-size:12px;padding:6px 6px;min-height:32px}
    .addrow input[type=text]{flex:1 1 110px;width:auto!important}
    .addrow select{flex:1 1 120px}
    button.act{padding:9px 14px;font-size:12.5px;flex:1 1 auto}
    .bar{gap:6px}
    .combo-head{flex-wrap:wrap;gap:8px;padding:10px}
    .combo-title{flex:1 1 100%;order:3}
    .combo-bars i{width:26px;height:26px}
    .combo-body{padding:12px 10px}
    .rule-txt{margin-left:0}
    details.method p{font-size:12px}
    /* live score follows you down the colour card */
    #mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;
      background:rgba(255,255,255,.97);border-top:1px solid var(--line);
      padding:7px 12px;align-items:center;gap:10px;
      box-shadow:0 -2px 10px rgba(0,0,0,.05)}
    #mbar.show{display:flex}
    .mbar-chips{display:flex;flex:0 0 auto}
    .mbar-chips i{width:22px;height:30px;border:1px solid rgba(0,0,0,.12);border-right:none}
    .mbar-chips i:last-child{border-right:1px solid rgba(0,0,0,.12)}
    .mbar-txt{flex:1;min-width:0;font-size:11.5px;color:var(--ink-soft);line-height:1.3}
    .mbar-sc{font-family:Georgia,serif;font-size:22px;font-variant-numeric:tabular-nums}
  }
  @media(max-width:400px){
    .pal-row{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
    .sw i{height:36px}
    .look-col{width:60px;flex:0 0 60px}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="htext">
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
  </div>
  <div class="langs" id="langs">
    <button data-l="zh">中文</button><button data-l="en">EN</button>
    <button data-l="es">ES</button><button data-l="fr">FR</button>
  </div>
</header>

<div class="stylerow">
  <span class="stylab" id="t-style"></span>
  <div class="styles" id="styles"></div>
  <span class="blurb" id="t-blurb"></span>
</div>

<div class="tabs">
  <button class="tab on" data-tab="quick" id="t-tab1"></button>
  <button class="tab" data-tab="ward" id="t-tab2"></button>
</div>

<section id="tab-quick">
<div class="qgrid">
  <div class="panel p-slots">
    <h2 id="t-h-look"></h2>
    <p class="hint" id="t-hint-look"></p>
    <div class="slots" id="slots"></div>
  </div>
  <div class="panel p-out" id="quick-out"></div>
  <div class="panel p-pal">
    <h3 id="t-h-pal1"></h3>
    <div id="pal-quick"></div>
  </div>
</div>
</section>

<section id="tab-ward" class="hide">
<div class="wgrid">
  <div class="panel p-build">
    <h2 id="t-h-build"></h2>
    <p class="hint" id="t-hint-build"></p>
    <div class="catpick" id="catpick"></div>
    <div class="justadd" id="w-just"></div>
    <div id="pal-ward"></div>
    <div class="bar">
      <button class="act ghost" id="w-demo"></button>
      <button class="act ghost" id="w-exp"></button>
      <button class="act ghost" id="w-imp"></button>
      <button class="act ghost" id="w-clr"></button>
    </div>
    <input type="file" id="w-file" accept=".json" class="hide">
  </div>
  <div class="panel p-list">
    <div class="listhead"><h2 id="t-h-list"></h2><span class="cnt" id="w-cnt"></span></div>
    <div class="items" id="w-items"></div>
  </div>
  <div class="panel p-gen">
    <div class="modes" id="modes"></div>
    <p class="hint" id="t-hint-mode"></p>
    <div class="bar">
      <label class="dayslabel" id="lbl-days"><span id="t-days"></span>
        <select id="w-days"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>7</option></select>
      </label>
      <button class="act" id="w-gen"></button>
    </div>
  </div>
  <div class="p-out" id="w-out"></div>
</div>
</section>

<details class="method">
<summary id="t-method-s"></summary>
<p id="t-method-p"></p>
</details>
</div>
<div id="mbar"><div class="mbar-chips" id="mbar-chips"></div>
  <div class="mbar-txt"><span id="mbar-v"></span></div><div class="mbar-sc" id="mbar-sc"></div></div>

<script>
"use strict";

/* ===================== i18n ===================== */
const LANGS=["zh","en","es","fr"];
const GROUPS=[
 {zh:"暖中性",en:"Warm neutrals",es:"Neutros cálidos",fr:"Neutres chauds"},
 {zh:"冷中性",en:"Cool neutrals",es:"Neutros fríos",fr:"Neutres froids"},
 {zh:"冷色",en:"Cool tones",es:"Tonos fríos",fr:"Tons froids"},
 {zh:"沉調點綴",en:"Muted accents",es:"Acentos apagados",fr:"Accents sourds"},
 {zh:"鮮豔色 · 高彩度",en:"Bright colours · high chroma",
  es:"Colores vivos · croma alto",fr:"Couleurs vives · chroma élevé"}
];

/* ---- style profiles: the six rules, parameterised ----
   Every rule below reads its thresholds and weights from here, so a new style is
   a data change, not a code change. */
const STYLES=[
 {key:"quiet",
  name:{zh:"靜奢",en:"Quiet luxury",es:"Quiet luxury",fr:"Quiet luxury"},
  blurb:{zh:"低彩度、明度分層、質料取代顏色做變化。彩度是第一個破功的地方。",
   en:"Low chroma, layered lightness, fabric doing the work colour would. Chroma is the first thing to break it.",
   es:"Croma bajo, luminosidad estratificada, el tejido hace lo que haría el color. El croma es lo primero que lo rompe.",
   fr:"Chroma bas, clarté étagée, la matière fait ce que la couleur ferait. Le chroma est le premier point de rupture."},
  chroma:{good:16,ok:26,high:36,meanWarn:14,meanBad:18},
  light:{good:25,thin:15,monoMaxC:16,midLo:40,midHi:68},
  hue:{two:0.7,many:0.2,bareMult:0.62},
  temp:{prefer:null},
  w:{chroma:25,light:25,hue:20,temp:15,shoe:15}},
 {key:"french",
  name:{zh:"法式簡約",en:"French minimal",es:"Minimalismo francés",fr:"Minimalisme français"},
  blurb:{zh:"允許一件說話的顏色,但要求明暗對比明確。中間調堆疊是這個風格最大的敵人。",
   en:"One piece is allowed to speak, but the light-dark contrast has to be decisive. Mid-tone stacking is this style's worst enemy.",
   es:"Una prenda puede hablar, pero el contraste claro-oscuro debe ser decidido. El apilado de tonos medios es el peor enemigo de este estilo.",
   fr:"Une pièce peut parler, mais le contraste clair-foncé doit être net. L'empilement de demi-teintes est le pire ennemi de ce style."},
  chroma:{good:20,ok:34,high:48,meanWarn:17,meanBad:23},
  light:{good:30,thin:20,monoMaxC:10,midLo:42,midHi:66},
  hue:{two:0.85,many:0.3,bareMult:0.8},
  temp:{prefer:null},
  w:{chroma:18,light:30,hue:17,temp:15,shoe:20}},
 {key:"urban",
  name:{zh:"都會極簡",en:"Urban minimal",es:"Minimalismo urbano",fr:"Minimalisme urbain"},
  blurb:{zh:"接近無彩色,單一色相,靠剪裁和明度說話。任何一個彩色都要付代價。",
   en:"Near-achromatic, one hue at most, carried by cut and lightness. Any colour at all costs you something.",
   es:"Casi acromático, un tono como máximo, sostenido por el corte y la luminosidad. Cualquier color tiene un coste.",
   fr:"Quasi achromatique, une teinte au maximum, porté par la coupe et la clarté. Toute couleur a un coût."},
  chroma:{good:10,ok:18,high:28,meanWarn:9,meanBad:13},
  light:{good:22,thin:12,monoMaxC:10,midLo:38,midHi:70},
  hue:{two:0.5,many:0.15,bareMult:0.7},
  temp:{prefer:null},
  w:{chroma:32,light:28,hue:22,temp:5,shoe:13}},
 {key:"warm",

  zh:p=>`所有顏色先從 sRGB 轉到 CIELAB,再取 LCH 的明度 L 與彩度 C。以下的數字是「${p.st}」這一組門檻,換風格數字就會換。彩度:整套最高 C 值在 ${p.c.good} 以下最穩、${p.c.ok} 以內可接受、超過 ${p.c.high} 就離開這個風格的語彙;另外全套平均 C 超過 ${p.c.meanBad} 會再打折,因為那表示不只一件在說話。明度:最亮與最暗之差至少 ${p.l.good},低於 ${p.l.thin} 就算層次太薄,並避免每件都落在 L ${p.l.midLo}–${p.l.midHi} 的中間帶,那是糊掉的主因;鞋不算進這個跨度,免得白鞋憑空製造出對比。若全套最高彩度在 ${p.l.monoMaxC} 以下,同色調堆疊可以成立,但層次必須靠質料差異補回來。色相家族:C 值 10 以上算有彩色,色相相差 40 度內視為同家族,家族數超過 2 就超出範圍;若有兩個家族又沒有一件 C 8 以下的近無彩色當底,會再扣一次。冷暖:色相 115 度以下與 335 度以上算暖,150–310 度算冷,兩者同時出現時需要近無彩色橋接。${p.prefer?"這個風格另外以暖調為骨架,整套走冷會扣分。":"這個風格不偏好特定色溫,只要求一致。"}鞋:明度應等於或低於上下身。質料層次為提示而非計分。分數是各規則的加權平均(彩度 ${p.w.chroma}、明度 ${p.w.light}、色相 ${p.w.hue}、冷暖 ${p.w.temp}、鞋 ${p.w.shoe}),沒有鞋時該權重按比例分給其餘規則;另外任何一條嚴重不過,總分會被壓在 58 或 72 以下,避免一條大錯被四條小對平均掉。這是一套明確的規則判斷,不是品味的定論——規則說不行而你穿起來好看,以你為準。`,
  en:p=>`Every colour is converted from sRGB to CIELAB, then read as LCH lightness (L) and chroma (C). The numbers below belong to "${p.st}" and change with the style. Chroma: the highest C in the outfit is safest below ${p.c.good}, acceptable up to ${p.c.ok}, and past ${p.c.high} it has left this style's vocabulary; an outfit-wide mean above ${p.c.meanBad} takes a further cut, because that means more than one piece is talking. Lightness: aim for at least ${p.l.good} between lightest and darkest, treat anything under ${p.l.thin} as thin layering, and avoid having every piece land in the L ${p.l.midLo}–${p.l.midHi} middle band, the main cause of a look going muddy; shoes are excluded from this span so white trainers can't invent contrast that the clothes don't have. If the outfit's highest chroma stays under ${p.l.monoMaxC}, tonal stacking is legitimate, but the layering then has to come from fabric. Hue families: C 10 and above counts as chromatic, hues within 40 degrees are one family, more than two is out of range, and two families with no near-neutral under C 8 underneath is penalised again. Warm/cool: hue up to 115 and above 335 reads warm, 150–310 reads cool, and both together need a near-neutral bridge. ${p.prefer?"This style is also built on warmth, so a fully cool outfit loses points.":"This style has no temperature preference — it only asks for consistency."} Shoes should sit at or below the lightness of top and bottom. Fabric layering is advice, not scored. The total is a weighted average (chroma ${p.w.chroma}, lightness ${p.w.light}, hue ${p.w.hue}, temperature ${p.w.temp}, shoes ${p.w.shoe}); with no shoes that weight is redistributed, and any badly failing rule caps the total at 58 or 72 so one real mistake can't be averaged away by four passes. This is an explicit rule check, not a verdict on taste — if a rule says no and it looks good on you, trust yourself.`,
  es:p=>`Cada color se convierte de sRGB a CIELAB y se lee como luminosidad (L) y croma (C) en LCH. Las cifras siguientes corresponden a "${p.st}" y cambian con el estilo. Croma: el C más alto del conjunto es más seguro por debajo de ${p.c.good}, aceptable hasta ${p.c.ok}, y por encima de ${p.c.high} sale del vocabulario de este estilo; una media superior a ${p.c.meanBad} resta otra vez, porque significa que habla más de una prenda. Luminosidad: busca al menos ${p.l.good} entre la prenda más clara y la más oscura, por debajo de ${p.l.thin} la estratificación es débil, y evita que todas caigan en la banda media L ${p.l.midLo}–${p.l.midHi}. El calzado queda fuera de ese cálculo para que unas deportivas blancas no inventen un contraste que la ropa no tiene. Si el croma máximo se queda por debajo de ${p.l.monoMaxC}, el apilado tonal es válido, pero las capas deben venir del tejido. Familias de tono: desde C 10 es cromático, tonos a menos de 40 grados son una familia, más de dos queda fuera, y dos familias sin una prenda casi neutra por debajo de C 8 se penaliza otra vez. Cálido/frío: tono hasta 115 y por encima de 335 es cálido, 150–310 frío, y ambos juntos necesitan un puente neutro. ${p.prefer?"Este estilo se construye además sobre la calidez, así que un conjunto totalmente frío pierde puntos.":"Este estilo no prefiere ninguna temperatura, solo pide coherencia."} El calzado debe ser igual o más oscuro que arriba y abajo. La mezcla de tejidos es consejo, no puntúa. El total es una media ponderada (croma ${p.w.chroma}, luminosidad ${p.w.light}, tono ${p.w.hue}, temperatura ${p.w.temp}, calzado ${p.w.shoe}); sin zapatos ese peso se redistribuye, y cualquier regla que falle claramente limita el total a 58 o 72, para que un error real no se diluya. Esto es una comprobación de reglas, no un veredicto sobre el gusto: si una regla dice que no y a ti te queda bien, hazte caso.`,
  fr:p=>`Chaque couleur est convertie du sRGB vers CIELAB, puis lue en LCH comme clarté (L) et chroma (C). Les chiffres ci-dessous appartiennent à « ${p.st} » et changent avec le style. Chroma : le C le plus élevé est le plus sûr sous ${p.c.good}, acceptable jusqu'à ${p.c.ok}, et au-delà de ${p.c.high} on sort du vocabulaire de ce style ; une moyenne supérieure à ${p.c.meanBad} pénalise encore, car cela signifie que plusieurs pièces parlent. Clarté : viser au moins ${p.l.good} d'écart, sous ${p.l.thin} la superposition est trop faible, et éviter que toutes les pièces tombent dans la bande médiane L ${p.l.midLo}–${p.l.midHi}. Les chaussures sont exclues de cet écart, pour qu'une paire blanche n'invente pas un contraste absent des vêtements. Si le chroma maximal reste sous ${p.l.monoMaxC}, l'empilement ton sur ton est valable, mais la superposition doit venir de la matière. Familles de teintes : à partir de C 10 une couleur est chromatique, des teintes séparées de moins de 40 degrés font une famille, plus de deux sort de la plage, et deux familles sans pièce quasi neutre sous C 8 sont pénalisées une seconde fois. Chaud/froid : teinte jusqu'à 115 et au-delà de 335 se lit chaude, 150–310 froide, et les deux ensemble exigent un pont neutre. ${p.prefer?"Ce style repose en outre sur la chaleur : une tenue entièrement froide perd des points.":"Ce style n'a pas de préférence de température, il demande seulement de la cohérence."} Les chaussures doivent être d'une clarté égale ou inférieure au haut et au bas. La superposition des matières est un conseil, sans note. Le total est une moyenne pondérée (chroma ${p.w.chroma}, clarté ${p.w.light}, teinte ${p.w.hue}, température ${p.w.temp}, chaussures ${p.w.shoe}) ; sans chaussures ce poids est redistribué, et toute règle nettement en échec plafonne le total à 58 ou 72, afin qu'une vraie erreur ne soit pas noyée. Il s'agit d'une vérification de règles, pas d'un verdict sur le goût — si une règle dit non et que cela vous va bien, faites-vous confiance.`}
};

 note_same:{zh:p=>`${p.a}和${p.b}同為${p.f}且明度幾乎相同,相疊會失去層次。把其中一件換成不同織法。`,

 note_fab:{zh:p=>`${p.n} 種質料(${p.list})在低彩度下撐起層次,這正是${p.st}的做法。`,

};

let L="zh";
try{ L=localStorage.getItem("ql_lang")||"zh"; }catch(e){}
if(!LANGS.includes(L)) L="zh";
const u=k=>UI[k][L];
const cn=hex=>{const o=CNAME[hex.toUpperCase()];return o?o[L]:hex;};
const cat=k=>{const o=CATS.find(c=>c.k===k);return o?o[L]:k;};
const fab=k=>{if(!k)return "";const o=FABRICS.find(f=>f.k===k);return o?o[L]:k;};
// the style name is injected into every message, so rule text names the active style
const m=(id,p)=>MSG[id][L](Object.assign({st:ST().name[L]},p||{}));

/* ===================== colour math ===================== */
function hexToRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lin(v){v/=255;return v<=0.04045? v/12.92 : Math.pow((v+0.055)/1.055,2.4);}
function lch(hex){
  const [R,G,B]=hexToRgb(hex), r=lin(R),g=lin(G),b=lin(B);
  const X=r*0.4124564+g*0.3575761+b*0.1804375;
  const Y=r*0.2126729+g*0.7151522+b*0.0721750;
  const Z=r*0.0193339+g*0.1191920+b*0.9503041;
  const f=t=>t>0.008856? Math.cbrt(t) : (7.787*t+16/116);
  const fx=f(X/0.95047), fy=f(Y/1), fz=f(Z/1.08883);
  const Lv=116*fy-16, a=500*(fx-fy), bb=200*(fy-fz);
  let H=Math.atan2(bb,a)*180/Math.PI; if(H<0)H+=360;
  return {L:+Lv.toFixed(1), C:+Math.sqrt(a*a+bb*bb).toFixed(1), H:+H.toFixed(1)};
}
function hueDist(a,b){const d=Math.abs(a-b)%360;return d>180?360-d:d;}
// closest quiet-luxury colour to a given hex: hold hue and lightness, drop chroma
function nearestQuiet(hex){
  const a=lch(hex); let best=null,bd=1e9;
  QUIET.forEach(h=>{
    const b=lch(h);
    let d=1.4*Math.abs(a.L-b.L)+1.0*hueDist(a.H,b.H);
    // a chromatic garment should be replaced by something that still has a colour,
    // not flattened straight to grey
    if(a.C>=25) d+=0.9*Math.max(0,12-b.C);
    if(d<bd){bd=d;best=h;}
  });
  return best;
}
function temp(H,C){ if(C<10) return "neutral";
  return lean(H,C); }
// temperature *direction*, ignoring the near-neutral cut-off: a cream at C 5.6 still
// leans warm, which matters for styles that ask for a temperature rather than just consistency
function lean(H,C){ if(C<3.5) return "none";
  if(H<=115||H>=335) return "warm";
  if(H>=150&&H<=310) return "cool";
  return "mid"; }

/* ===================== scoring ===================== */
function scoreLook(items){
  const its=items.map(o=>Object.assign({},o,lch(o.hex),{cname:cn(o.hex),catName:cat(o.cat)}));
  if(its.length<2) return null;
  const rules=[], S=ST();   // every threshold and weight below comes from the active style
  const C=S.chroma, LT=S.light, HU=S.hue, TP=S.temp, W=S.w;

  const maxC=Math.max(...its.map(i=>i.C));
  const meanC=+(its.reduce((s,i)=>s+i.C,0)/its.length).toFixed(1);
  const loud=its.slice().sort((a,b)=>b.C-a.C)[0];
  let r;
  if(maxC<=C.good) r=[1,"good","chroma_good",{c:maxC}];
  else if(maxC<=C.ok) r=[0.72,"warn","chroma_ok",{cat:loud.catName,name:loud.cname,c:maxC}];
  else if(maxC<=C.high) r=[0.4,"warn","chroma_high",{cat:loud.catName,name:loud.cname,c:maxC}];
  else r=[0.12,"bad","chroma_bad",{cat:loud.catName,name:loud.cname,c:maxC}];
  let cTxt=m(r[2],r[3]), cRatio=r[0], cV=r[1];
  if(meanC>C.meanBad){ cRatio=+(cRatio*0.5).toFixed(3); cV="bad";
    if(maxC<=C.high) cTxt=m("chroma_high",{cat:loud.catName,name:loud.cname,c:maxC});
    cTxt+=" "+m("chroma_mean",{mean:meanC}); }
  else if(meanC>C.meanWarn){ cRatio=+(cRatio*0.7).toFixed(3); if(cV==="good")cV="warn"; cTxt+=" "+m("chroma_mean",{mean:meanC}); }
  rules.push({key:"chroma",name:u("rChroma"),w:W.chroma,ratio:cRatio,v:cV,txt:cTxt});

  // lightness is read from the garments only — shoes anchor the look but must not
  // be allowed to "create" a lightness range that the clothes themselves don't have
  let gar=its.filter(i=>i.cat!=="shoe");
  if(gar.length<2) gar=its;
  const Ls=gar.map(i=>i.L), maxL=Math.max(...Ls), minL=Math.min(...Ls), range=+(maxL-minL).toFixed(1);
  const allMid=gar.every(i=>i.L>=LT.midLo&&i.L<=LT.midHi);
  const lightest=gar.find(i=>i.L===maxL), darkest=gar.find(i=>i.L===minL);
  if(allMid) r=[0.3,"bad","light_mid",{min:minL,max:maxL}];
  else if(range>=LT.good) r=[1,"good","light_good",{r:range,lcat:lightest.catName,lname:lightest.cname,max:maxL,dcat:darkest.catName,dname:darkest.cname,min:minL}];
  else if(range>=LT.thin) r=[0.62,"warn","light_thin",{r:range}];
  else if(maxC<=LT.monoMaxC) r=[0.55,"warn","light_mono",{r:range}];
  else r=[0.25,"bad","light_flat",{r:range}];
  rules.push({key:"light",name:u("rLight"),w:W.light,ratio:r[0],v:r[1],txt:m(r[2],r[3])});

  const chrom=its.filter(i=>i.C>=10), fams=[];
  chrom.forEach(i=>{const f=fams.find(x=>hueDist(x.H,i.H)<=40); if(f)f.n.push(i); else fams.push({H:i.H,n:[i]});});
  const famTxt=fams.map(f=>f.n.map(x=>x.cname).join(" / ")).join(" · ");
  if(fams.length===0) r=[1,"good","hue_none",{}];
  else if(fams.length===1) r=[1,"good","hue_one",{list:famTxt}];
  else if(fams.length===2) r=[HU.two,HU.two>=0.8?"good":"warn","hue_two",{list:famTxt}];
  else r=[HU.many,"bad","hue_many",{n:fams.length,list:famTxt}];
  let hTxt=m(r[2],r[3]), hRatio=r[0], hV=r[1];
  const anchors=its.filter(i=>i.C<8).length;
  if(fams.length>=2&&anchors===0){ hRatio=+(hRatio*HU.bareMult).toFixed(3); hV="bad"; hTxt+=" "+m("hue_bare"); }
  rules.push({key:"hue",name:u("rHue"),w:W.hue,ratio:hRatio,v:hV,txt:hTxt});

  const ts=its.map(i=>({i,t:temp(i.H,i.C)}));
  const warms=ts.filter(x=>x.t==="warm").map(x=>x.i), cools=ts.filter(x=>x.t==="cool").map(x=>x.i);
  const bridge=its.find(i=>i.C<8);
  const wl=warms.map(x=>x.cname).join(" / "), cl=cools.map(x=>x.cname).join(" / ");
  let tempPrefMiss=false;
  if(warms.length&&cools.length){
    if(bridge) r=[0.72,"warn","temp_bridge",{warm:wl,cool:cl,cat:bridge.catName,name:bridge.cname,c:bridge.C}];
    else r=[0.35,"bad","temp_clash",{warm:wl,cool:cl}];
  } else if(warms.length) r=[1,"good","temp_warm",{list:wl}];
  else if(cools.length) r=[1,"good","temp_cool",{list:cl}];
  else r=[1,"good","temp_neutral",{}];
  // styles with a stated temperature preference judge direction, not just consistency.
  // it reads the hue lean rather than temp(), so a cream at C 5.6 still counts as warm
  // and a mint at C 30 can't slip through as "neutral"
  if(TP.prefer==="warm"){
    const leans=its.map(i=>({i,t:lean(i.H,i.C)}));
    const warmish=leans.filter(x=>x.t==="warm").map(x=>x.i);
    const against=leans.filter(x=>(x.t==="cool"||x.t==="mid")&&x.i.C>=8).map(x=>x.i);
    const al=against.map(x=>x.cname).join(" / "), wl2=warmish.map(x=>x.cname).join(" / ");
    if(warmish.length&&against.length){
      if(bridge) r=[0.6,"warn","temp_bridge",{warm:wl2,cool:al,cat:bridge.catName,name:bridge.cname,c:bridge.C}];
      else r=[0.35,"bad","temp_clash",{warm:wl2,cool:al}];
    } else if(against.length){ r=[0.3,"bad","temp_pref_bad",{list:al}]; tempPrefMiss=true; }
    else if(warmish.length) r=[1,"good","temp_pref_ok",{list:wl2}];
    else { r=[0.68,"warn","temp_pref_none",{}]; tempPrefMiss=true; }
  }
  rules.push({key:"temp",name:u("rTemp"),w:W.temp,ratio:r[0],v:r[1],txt:m(r[2],r[3])});

  const shoe=its.find(i=>i.cat==="shoe");
  if(shoe){
    const body=its.filter(i=>i.cat==="top"||i.cat==="bottom");
    const minBody=Math.min(...body.map(i=>i.L));
    if(shoe.L<=minBody+6) r=[1,"good","shoe_good",{name:shoe.cname,l:shoe.L}];
    else if(shoe.L<=minBody+18) r=[0.6,"warn","shoe_ok",{name:shoe.cname,l:shoe.L}];
    else r=[0.25,"bad","shoe_bad",{name:shoe.cname,l:shoe.L}];
    rules.push({key:"shoe",name:u("rShoe"),w:W.shoe,ratio:r[0],v:r[1],txt:m(r[2],r[3])});
  }

  const wsum=rules.reduce((s,x)=>s+x.w,0);
  let total=Math.round(rules.reduce((s,x)=>s+x.ratio*x.w,0)/wsum*100);
  // one hard failure must not be averaged away by four passes
  const worstRatio=Math.min(...rules.map(x=>x.ratio));
  if(worstRatio<=0.3) total=Math.min(total,58);
  else if(worstRatio<=0.6) total=Math.min(total,72);

  const notes=[];
  for(let k=0;k<its.length-1;k++){
    const a=its[k],b=its[k+1];
    if(a.fabric&&b.fabric&&a.fabric===b.fabric&&Math.abs(a.L-b.L)<12)
      notes.push(m("note_same",{a:a.catName,b:b.catName,f:fab(a.fabric)}));
  }
  const fabs=[...new Set(its.map(i=>i.fabric).filter(Boolean))];
  if(fabs.length>=3&&maxC<=C.ok) notes.push(m("note_fab",{n:fabs.length,list:fabs.map(fab).join(" / ")}));
  its.filter(i=>i.C>C.ok).forEach(i=>{
    const alt=nearestQuiet(i.hex), av=lch(alt);
    notes.push(m("sub_one",{cat:i.catName,name:i.cname,c:i.C,alt:cn(alt),ac:av.C}));
  });

  const worst=rules.slice().sort((a,b)=>a.ratio-b.ratio)[0];
  let fix;
  if(worst.ratio>=0.95) fix=m("fix_none");
  else if(worst.key==="chroma") fix=m("fix_chroma",{cat:loud.catName,name:loud.cname});
  else if(worst.key==="light") fix=allMid?m("fix_light_mid",{tgt:LT.good}):m("fix_light",{tgt:LT.good});
  else if(worst.key==="hue") fix=m("fix_hue");
  else if(worst.key==="temp") fix=tempPrefMiss?m("fix_temp_pref"):m("fix_temp");
  else fix=m("fix_shoe");

  const verdict = total>=85?V.v1[L]:total>=70?V.v2[L]:total>=55?V.v3[L]:V.v4[L];
  return {items:its,rules,total,verdict,notes,fix};
}

/* ===================== render helpers ===================== */
const VC={good:"var(--good)",warn:"var(--warn)",bad:"var(--bad)"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderPalette(el,onPick){
  el.innerHTML=PALETTE.map(g=>
    `<div class="pal-group${g.bright?" bright":""}"><div class="pal-label">${GROUPS[g.gi][L]}</div>`+
    (g.bright?`<div class="pal-note">${esc(UI.brightNote[L](ST().name[L]))}</div>`:"")+`<div class="pal-row">`+
    g.c.map(r=>`<div class="sw" data-hex="${r[0]}"><i style="background:${r[0]}"></i><span>${esc(cn(r[0]))}</span></div>`).join("")+
    `</div></div>`).join("");
  el.querySelectorAll(".sw").forEach(sw=>sw.onclick=()=>onPick(sw.dataset.hex,sw));
}
function lookHTML(its){
  return `<div class="look">`+its.map(i=>`
    <div class="look-row">
      <div class="look-col" style="background:${i.hex}"></div>
      <div class="look-txt">
        <div class="look-cat">${esc(i.catName)}</div>
        <div class="look-name">${esc(i.cname)}${i.name?` · ${esc(i.name)}`:""}${i.fabric?` <span class="look-num">/ ${esc(fab(i.fabric))}</span>`:""}</div>
        <div class="look-num">${i.hex.toUpperCase()} · L ${i.L} · C ${i.C} · H ${i.H}</div>
      </div>
    </div>`).join("")+`</div>`;
}
function resultHTML(res,withLook){
  if(!res) return `<div class="empty">${u("needTwo")}</div>`;
  return (withLook?lookHTML(res.items):"")+
   `<div class="score-head"><div class="score-num">${res.total}</div><div class="score-verdict">${esc(res.verdict)}</div></div><div>`+
   res.rules.map(x=>`<div class="rule">
      <div class="rule-top"><span class="dot" style="background:${VC[x.v]}"></span>
      <span class="rule-name">${esc(x.name)}</span>
      <span class="rule-w">${Math.round(x.ratio*100)}% · ${u("weight")} ${x.w}</span></div>
      <div class="rule-txt">${esc(x.txt)}</div></div>`).join("")+
   `</div><div class="fix"><b>${u("fixLabel")}</b>${esc(res.fix)}</div>`+
   (res.notes.length?`<div class="notes">`+res.notes.map(n=>`<div>· ${esc(n)}</div>`).join("")+`</div>`:"");
}

/* ===================== quick tab ===================== */
const quick={outer:null,top:null,bottom:null,shoe:null};
let activeSlot="top";

function drawSlots(){
  const el=document.getElementById("slots");
  el.innerHTML=CATS.map(c=>{
    const v=quick[c.k];
    const opt=(c.k==="outer"||c.k==="shoe")?`<span class="slot-opt">${u("optional")}</span>`:"";
    return `<div class="slot ${c.k===activeSlot?"active":""}" data-cat="${c.k}">
      <span class="chip" style="${v?`background:${v.hex};background-image:none`:""}"></span>
      <span class="slot-meta"><span class="slot-cat">${esc(c[L])} ${opt}</span><br>
      <span class="slot-col">${v?`${esc(cn(v.hex))} · ${v.hex.toUpperCase()}`:u("noColour")}</span></span>
      <select data-fab="${c.k}"><option value="">${u("fabricPH")}</option>${
        FABRICS.map(f=>`<option value="${f.k}" ${v&&v.fabric===f.k?"selected":""}>${esc(f[L])}</option>`).join("")}</select>
      ${v?`<button class="xbtn" data-del="${c.k}">&times;</button>`:""}</div>`;
  }).join("");
  el.querySelectorAll(".slot").forEach(s=>s.onclick=e=>{
    if(e.target.tagName==="SELECT"||e.target.dataset.del)return;
    activeSlot=s.dataset.cat; drawSlots();
  });
  el.querySelectorAll("[data-fab]").forEach(sel=>sel.onchange=()=>{
    const k=sel.dataset.fab; if(quick[k]){quick[k].fabric=sel.value; drawQuick();}
  });
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();quick[b.dataset.del]=null;drawSlots();drawQuick();});
}
let onQuickTab=true;
function drawQuick(){
  const its=CATS.filter(c=>quick[c.k]).map(c=>({cat:c.k,hex:quick[c.k].hex,fabric:quick[c.k].fabric||"",name:""}));
  const res=its.length<2?null:scoreLook(its);
  document.getElementById("quick-out").innerHTML=
    `<h2>${u("hRead")}</h2><p class="hint">${u("hintRead")}</p>`+
    (res?resultHTML(res,true):`<div class="empty">${u("needTwo")}</div>`);
  // mobile sticky readout so the score stays visible while scrolling the colour card
  const bar=document.getElementById("mbar");
  document.getElementById("mbar-chips").innerHTML=its.map(i=>`<i style="background:${i.hex}"></i>`).join("");
  document.getElementById("mbar-v").textContent=res?res.verdict:u("needTwo");
  document.getElementById("mbar-sc").textContent=res?res.total:"";
  bar.classList.toggle("show",onQuickTab&&its.length>0);
}

/* ===================== wardrobe tab ===================== */
const KEY="ql_wardrobe_v1";
const norm=i=>({cat:i.cat,hex:String(i.hex).toUpperCase(),fabric:i.fabric||"",name:i.name||"",
  pin:!!i.pin,skip:!!i.skip});
let ward=[];
try{ const d=JSON.parse(localStorage.getItem(KEY)||"[]");
  if(Array.isArray(d)) ward=d.filter(i=>i&&i.hex&&i.cat).map(norm); }catch(e){ ward=[]; }
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ward));}catch(e){}};

let addCat="top";        // the category the next colour tap lands in
let wmode="today";       // today | trip | rank
try{ wmode=localStorage.getItem("ql_mode")||"today"; }catch(e){}
if(!["today","trip","rank"].includes(wmode)) wmode="today";

const MODES=[{k:"today",t:"mToday",h:"hintToday"},{k:"trip",t:"mTrip",h:"hintTrip"},{k:"rank",t:"mRank",h:"hintRank"}];
const SAMPLE=[
 {cat:"outer",hex:"#2E3A4C",fabric:"wool"},  {cat:"outer",hex:"#9A8770",fabric:"cotton"},
 {cat:"top",hex:"#F3EDE3",fabric:"cotton"},  {cat:"top",hex:"#E0D5C2",fabric:"knit"},
 {cat:"top",hex:"#4A4C4D",fabric:"cash"},    {cat:"top",hex:"#A3AA96",fabric:"linen"},
 {cat:"bottom",hex:"#3B302A",fabric:"wool"}, {cat:"bottom",hex:"#77797A",fabric:"wool"},
 {cat:"bottom",hex:"#D6C6AC",fabric:"cotton"},
 {cat:"shoe",hex:"#2A2B2B",fabric:"leather"},{cat:"shoe",hex:"#5C4A3A",fabric:"suede"}
];

function drawCatPick(){
  const el=document.getElementById("catpick");
  el.innerHTML=CATS.map(c=>{
    const n=ward.filter(i=>i.cat===c.k).length;
    return `<button data-ac="${c.k}" class="${c.k===addCat?"on":""}">${esc(c[L])}<span class="n">${n}</span></button>`;
  }).join("");
  el.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{addCat=b.dataset.ac;drawCatPick();});
}
function showJust(it){
  const el=document.getElementById("w-just");
  if(!it){el.innerHTML="";return;}
  el.innerHTML=`<i style="background:${it.hex}"></i><span>${esc(UI.justAdded[L](cat(it.cat),cn(it.hex)))}</span>`+
    `<button id="w-undo">${u("undo")}</button>`;
  document.getElementById("w-undo").onclick=()=>{
    const k=ward.lastIndexOf(it); if(k>=0) ward.splice(k,1);
    save(); drawCatPick(); drawWard(); showJust(null);
  };
}
function drawWard(){
  const el=document.getElementById("w-items"), n=ward.length, off=ward.filter(i=>i.skip).length;
  document.getElementById("w-cnt").textContent=n?UI.cntItems[L](n,off):"";
  if(!n){el.innerHTML=`<div class="empty">${u("emptyWard")}</div>`;return;}
  el.innerHTML=CATS.filter(c=>ward.some(i=>i.cat===c.k)).map(c=>
    `<div class="wsec"><h3>${esc(c[L])}</h3></div>`+
    ward.map((i,idx)=>i.cat!==c.k?"":`<div class="item${i.skip?" off":""}${i.pin?" pinned":""}">
      <i style="background:${i.hex}"></i>
      <span class="nm">${esc(cn(i.hex))} <span class="fb">L ${lch(i.hex).L}</span></span>
      <select data-fb="${idx}"><option value="">${u("fabricPH")}</option>${
        FABRICS.map(f=>`<option value="${f.k}"${i.fabric===f.k?" selected":""}>${esc(f[L])}</option>`).join("")}</select>
      <button class="ibtn${i.pin?" on":""}" data-pin="${idx}">${u("pinned")}</button>
      <button class="ibtn${i.skip?" on":""}" data-skip="${idx}">${u("skipped")}</button>
      <button class="xbtn" data-rm="${idx}">&times;</button></div>`).join("")).join("");
  el.querySelectorAll("[data-fb]").forEach(s=>s.onchange=()=>{ward[+s.dataset.fb].fabric=s.value;save();});
  el.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>{
    const i=ward[+b.dataset.pin]; i.pin=!i.pin; if(i.pin)i.skip=false; save(); drawWard(); });
  el.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>{
    const i=ward[+b.dataset.skip]; i.skip=!i.skip; if(i.skip)i.pin=false; save(); drawWard(); });
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    ward.splice(+b.dataset.rm,1); save(); drawCatPick(); drawWard(); showJust(null); });
}
function drawModes(){
  const el=document.getElementById("modes");
  el.innerHTML=MODES.map(x=>`<button data-md="${x.k}" class="${x.k===wmode?"on":""}">${esc(u(x.t))}</button>`).join("");
  el.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{
    wmode=b.dataset.md; try{localStorage.setItem("ql_mode",wmode);}catch(e){}
    drawModes(); document.getElementById("w-out").innerHTML="";
  });
  document.getElementById("t-hint-mode").textContent=u(MODES.find(x=>x.k===wmode).h);
  document.getElementById("lbl-days").classList.toggle("hide",wmode!=="trip");
}

/* ---- combination engine ---- */
const ikey=i=>i.cat+"|"+i.hex+"|"+(i.name||"");
const CAP=3000;   // scoring is cheap but not free; a very large wardrobe gets truncated
function allCombos(){
  const live=ward.filter(i=>!i.skip);
  const g=k=>{const a=live.filter(i=>i.cat===k), p=a.filter(i=>i.pin);
    return {use:p.length?p:a, forced:p.length>0};};
  const T=g("top"), B=g("bottom"), O=g("outer"), S=g("shoe");
  if(!T.use.length||!B.use.length) return null;
  const outOpts=O.use.length?(O.forced?O.use:[null,...O.use]):[null];
  const shoeOpts=S.use.length?S.use:[null];
  const list=[]; let capped=false;
  scan:
  for(const t of T.use) for(const b of B.use) for(const o of outOpts) for(const s of shoeOpts){
    if(list.length>=CAP){capped=true;break scan;}
    const picks=[o,t,b,s].filter(Boolean);
    const res=scoreLook(picks.map(i=>({cat:i.cat,hex:i.hex,fabric:i.fabric||"",name:i.name||""})));
    if(res) list.push({res,o,t,b,s});
  }
  list.sort((a,b)=>b.res.total-a.res.total);
  return {list,capped};
}
// highest scoring outfits that don't reuse the same top or bottom
function pickDistinct(list,n){
  const out=[],ut=new Set(),ub=new Set();
  for(const c of list){ if(out.length>=n)break;
    const kt=ikey(c.t), kb=ikey(c.b);
    if(ut.has(kt)||ub.has(kb))continue;
    out.push(c); ut.add(kt); ub.add(kb);
  }
  for(const c of list){ if(out.length>=n)break; if(out.indexOf(c)<0)out.push(c); }
  return out;
}
// one jacket and one pair of shoes for the whole trip: pick the pair whose best
// N distinct outfits average highest, so the suitcase stays small
function tripPlan(list,days){
  const groups=new Map();
  list.forEach(c=>{
    const k=(c.o?ikey(c.o):"-")+"::"+(c.s?ikey(c.s):"-");
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(c);
  });
  let best=null;
  groups.forEach(g=>{
    const pick=pickDistinct(g,days), sum=pick.reduce((s,c)=>s+c.res.total,0);
    const cand={pick,n:pick.length,avg:pick.length?sum/pick.length:0};
    if(!best||cand.n>best.n||(cand.n===best.n&&cand.avg>best.avg)) best=cand;
  });
  return best;
}

/* ---- output ---- */
function comboCard(c,label){
  return `<div class="combo">
    <div class="combo-head">
      <span class="combo-bars">${c.res.items.map(i=>`<i style="background:${i.hex}"></i>`).join("")}</span>
      <span class="combo-title">${esc(label)} · ${c.res.items.map(i=>esc(i.cname)).join(" / ")}<br>
        <span class="look-num">${esc(c.res.verdict)}</span></span>
      <span class="combo-sc">${c.res.total}</span></div>
    <div class="combo-body">${resultHTML(c.res,true)}</div></div>`;
}
function rankRow(c){
  return `<div class="item">
    <span class="combo-bars" style="flex:0 0 auto">${c.res.items.map(i=>`<i style="background:${i.hex};width:20px;height:20px"></i>`).join("")}</span>
    <span class="nm" style="font-size:12.5px">${c.res.items.map(i=>esc(i.cname)).join(" / ")}<br>
      <span class="fb">${esc(c.res.fix)}</span></span>
    <span class="fb">${c.res.total}</span></div>`;
}
function bindOut(pick,labeller){
  const out=document.getElementById("w-out");
  out.querySelectorAll(".combo-head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  const cp=document.getElementById("cp");
  if(!cp)return;
  cp.textContent=u("copy");
  cp.onclick=()=>{
    const txt=`${ST().name[L]}\n\n`+pick.map((c,n)=>`${labeller(n+1)} (${c.res.total} · ${c.res.verdict})\n`+
      c.res.items.map(i=>`  ${i.catName}: ${i.cname} ${i.hex.toUpperCase()}${i.fabric?" / "+fab(i.fabric):""}`).join("\n")+
      `\n  ${u("suggestion")}: ${c.res.fix}`).join("\n\n");
    navigator.clipboard.writeText(txt).then(()=>cp.textContent=u("copied")).catch(()=>cp.textContent=u("copyFail"));
  };
}
function generate(){
  const out=document.getElementById("w-out"), got=allCombos();
  if(!got){ out.innerHTML=`<div class="panel"><div class="empty">${u("needTB")}</div></div>`; return; }
  const list=got.list, warn=got.capped?`<p class="hint">${u("tooMany")}</p>`:"";

  if(wmode==="today"){
    const pick=pickDistinct(list,3);
    out.innerHTML=`<div class="panel"><h2>${u("hToday")}</h2>
      <p class="hint">${UI.hintTop[L](list.length)}</p>${warn}
      ${pick.map((c,n)=>comboCard(c,UI.outfitN[L](n+1))).join("")}
      <div class="bar"><button class="act ghost" id="cp"></button></div></div>`;
    bindOut(pick,n=>UI.outfitN[L](n));

  } else if(wmode==="trip"){
    const days=+document.getElementById("w-days").value;
    const pick=tripPlan(list,days).pick;
    const packed=[], seen=new Set();
    pick.forEach(c=>[c.o,c.t,c.b,c.s].filter(Boolean).forEach(i=>{
      const k=ikey(i); if(!seen.has(k)){seen.add(k);packed.push(i);} }));
    out.innerHTML=`<div class="panel"><h2>${UI.hDays[L](pick.length)}</h2>
      <p class="hint">${UI.hintDays[L](list.length,pick.length)}</p>${warn}
      ${pick.map((c,n)=>comboCard(c,UI.dayN[L](n+1))).join("")}
      <div class="bar"><button class="act ghost" id="cp"></button></div></div>
      <div class="panel wsec"><h2>${u("hPack")}</h2>
      <p class="hint">${UI.hintPack[L](pick.length)}</p>
      <div class="pack">${CATS.map(c=>packed.filter(i=>i.cat===c.k).map(i=>
        `<div class="pkg"><i style="background:${i.hex}"></i><span>${esc(c[L])} · ${esc(cn(i.hex))}${
          i.fabric?" / "+esc(fab(i.fabric)):""}</span></div>`).join("")).join("")}</div></div>`;
    bindOut(pick,n=>UI.dayN[L](n));

  } else {
    const good=list.filter(c=>c.res.total>=70);
    const bad=list.slice(-6).reverse().filter(c=>c.res.total<70);
    out.innerHTML=`<div class="panel"><h2>${UI.hRankGood[L](good.length)}</h2>${warn}
      ${good.length?`<div class="items">`+good.slice(0,60).map(rankRow).join("")+`</div>`
        :`<div class="empty">${u("noneGood")}</div>`}
      ${bad.length?`<div class="wsec"><h3>${u("hRankBad")}</h3></div>
        <div class="items lowlist">`+bad.map(rankRow).join("")+`</div>`:""}</div>`;
  }
  if(window.matchMedia("(max-width:880px)").matches)
    out.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ===================== language / boot ===================== */
function applyLang(){
  const S=ST(), sn=S.name[L];
  document.documentElement.lang = L==="zh"?"zh-Hant":L;
  document.title=UI.title[L](sn);
  const set=(id,v)=>document.getElementById(id).textContent=v;
  set("t-title",UI.title[L](sn)); set("t-sub",UI.sub[L](sn));
  set("t-style",u("styleLab")); set("t-blurb",S.blurb[L]);
  set("t-tab1",u("tab1")); set("t-tab2",u("tab2"));
  set("t-h-look",u("hLook")); set("t-hint-look",u("hintLook"));
  set("t-h-pal1",u("hPal"));
  set("t-h-build",u("hBuild")); set("t-hint-build",u("hintBuild"));
  set("t-h-list",u("hList")); set("t-days",u("days"));
  set("t-method-s",u("methodS"));
  set("t-method-p",UI.methodP[L]({st:sn,c:S.chroma,l:S.light,w:S.w,prefer:S.temp.prefer}));
  ["gen","demo","exp","imp","clr"].forEach(k=>document.getElementById("w-"+k).textContent=u(k));
  document.getElementById("styles").innerHTML=STYLES.map(s=>
    `<button data-st="${s.key}" class="${s.key===STK?"on":""}">${esc(s.name[L])}</button>`).join("");
  document.querySelectorAll("#styles button").forEach(b=>b.onclick=()=>{
    STK=b.dataset.st; try{localStorage.setItem("ql_style",STK);}catch(e){} applyLang();
  });
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  renderPalette(document.getElementById("pal-quick"),hex=>{
    quick[activeSlot]={hex,fabric:quick[activeSlot]?quick[activeSlot].fabric:""};
    const order=["top","bottom","outer","shoe"], nxt=order.find(k=>!quick[k]);
    if(nxt)activeSlot=nxt;
    drawSlots(); drawQuick();
  });
  // one tap on a colour puts the piece straight into the wardrobe — no confirm step
  renderPalette(document.getElementById("pal-ward"),(hex,sw)=>{
    const it=norm({cat:addCat,hex});
    ward.push(it); save(); drawCatPick(); drawWard(); showJust(it);
    sw.classList.add("added"); setTimeout(()=>sw.classList.remove("added"),450);
  });
  drawSlots(); drawQuick(); drawCatPick(); drawModes(); drawWard(); showJust(null);
  document.getElementById("w-out").innerHTML="";
}
document.querySelectorAll("#langs button").forEach(b=>b.onclick=()=>{
  L=b.dataset.l; try{localStorage.setItem("ql_lang",L);}catch(e){} applyLang();
});
document.getElementById("w-demo").onclick=()=>{
  if(ward.length&&!confirm(u("confirmDemo")))return;
  ward=SAMPLE.map(norm); save(); drawCatPick(); drawWard(); showJust(null);
  document.getElementById("w-out").innerHTML="";
};
document.getElementById("w-clr").onclick=()=>{ if(confirm(u("confirmClear"))){
  ward=[]; save(); drawCatPick(); drawWard(); showJust(null);
  document.getElementById("w-out").innerHTML=""; } };
document.getElementById("w-exp").onclick=()=>{
  const blob=new Blob([JSON.stringify(ward,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wardrobe.json";a.click();
};
document.getElementById("w-imp").onclick=()=>document.getElementById("w-file").click();
document.getElementById("w-file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);
    if(Array.isArray(d)){ ward=d.filter(i=>i&&i.hex&&i.cat).map(norm); save(); drawCatPick(); drawWard(); showJust(null); }
  }catch(err){ alert(u("readErr")); }};
  rd.readAsText(f);
};
document.getElementById("w-gen").onclick=generate;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  onQuickTab=t.dataset.tab==="quick";
  document.getElementById("tab-quick").classList.toggle("hide",!onQuickTab);
  document.getElementById("tab-ward").classList.toggle("hide",onQuickTab);
  drawQuick();
});
document.getElementById("mbar").onclick=()=>
  document.querySelector(".p-out").scrollIntoView({behavior:"smooth",block:"start"});
applyLang();
</script>
