const MSG={
 chroma_good:{zh:p=>`整套最高彩度 C ${p.c},落在${p.st}最穩的區間。顏色不搶話,質料才有機會被看見。`,
  en:p=>`Highest chroma in the outfit is C ${p.c}, right in the safe band. Nothing shouts, so the fabric gets to do the talking.`,
  es:p=>`El croma más alto es C ${p.c}, dentro de la banda segura. Ningún color grita, así que el tejido habla.`,
  fr:p=>`Le chroma le plus élevé est C ${p.c}, dans la zone sûre. Aucune couleur ne crie, la matière peut s'exprimer.`},
 chroma_ok:{zh:p=>`最高彩度來自${p.cat}的${p.name}(C ${p.c})。還在可接受範圍,但它會是全身的視覺重心,其餘必須更安靜。`,
  en:p=>`The loudest piece is the ${p.cat.toLowerCase()} in ${p.name} (C ${p.c}). Still acceptable, but it becomes the focal point, so everything else has to stay quieter.`,
  es:p=>`La prenda más llamativa es ${p.cat.toLowerCase()} en ${p.name} (C ${p.c}). Aceptable, pero será el centro visual y el resto debe callarse.`,
  fr:p=>`La pièce la plus vive est ${p.cat.toLowerCase()} en ${p.name} (C ${p.c}). Acceptable, mais elle devient le point focal ; le reste doit rester discret.`},
 chroma_high:{zh:p=>`${p.cat}的${p.name}彩度 C ${p.c} 偏高,已經開始超出${p.st}的容忍度。`,
  en:p=>`The ${p.cat.toLowerCase()} in ${p.name} is at C ${p.c} — high enough to start pushing past what ${p.st} tolerates.`,
  es:p=>`${p.cat} en ${p.name} está en C ${p.c}: lo bastante alto para empezar a salirse de lo que ${p.st} tolera.`,
  fr:p=>`${p.cat} en ${p.name} atteint C ${p.c} — assez haut pour commencer à dépasser ce que ${p.st} tolère.`},
 chroma_bad:{zh:p=>`${p.cat}的${p.name}彩度 C ${p.c},已經超出${p.st}的色彩範圍。`,
  en:p=>`The ${p.cat.toLowerCase()} in ${p.name} sits at C ${p.c}, outside the ${p.st} range entirely.`,
  es:p=>`${p.cat} en ${p.name} está en C ${p.c}, fuera del rango de ${p.st}.`,
  fr:p=>`${p.cat} en ${p.name} est à C ${p.c}, hors de la plage de ${p.st}.`},
 chroma_mean:{zh:p=>`而且不只一件在說話——全套平均彩度 C ${p.mean},缺少讓眼睛休息的地方。`,
  en:p=>`And it is not just one piece talking — average chroma across the outfit is C ${p.mean}, leaving the eye nowhere to rest.`,
  es:p=>`Y no es solo una prenda: el croma medio del conjunto es C ${p.mean}, sin un punto donde descanse la vista.`,
  fr:p=>`Et ce n'est pas une seule pièce — le chroma moyen de la tenue est C ${p.mean}, l'œil n'a nulle part où se reposer.`},
 acc_one:{zh:p=>`亮點只有一個:${p.cat}的${p.name}(C ${p.c}),其餘都在 C ${p.loud} 以下當底。這就是運動休閒的正確結構——一個焦點,其他退到背景。`,
  en:p=>`Exactly one accent: the ${p.cat.toLowerCase()} in ${p.name} (C ${p.c}), with everything else under C ${p.loud} holding the base. That is the correct athleisure structure — one focal point, the rest recedes.`,
  es:p=>`Un solo acento: ${p.cat.toLowerCase()} en ${p.name} (C ${p.c}), con el resto por debajo de C ${p.loud} como base. Esa es la estructura correcta del estilo deportivo: un foco y el resto al fondo.`,
  fr:p=>`Un seul accent : ${p.cat.toLowerCase()} en ${p.name} (C ${p.c}), le reste sous C ${p.loud} tient la base. C'est la bonne structure sport : un point focal, le reste en retrait.`},
 acc_base:{zh:p=>`不過當底的那幾件平均彩度 C ${p.mean},高於 ${p.max}——底本身也在說話,亮點就不明顯了。`,
  en:p=>`That said, the pieces holding the base average C ${p.mean}, above ${p.max} — the base is talking too, which blunts the accent.`,
  es:p=>`Aun así, las prendas de base promedian C ${p.mean}, por encima de ${p.max}: la base también habla y eso diluye el acento.`,
  fr:p=>`Cela dit, les pièces de base sont en moyenne à C ${p.mean}, au-dessus de ${p.max} — la base parle aussi, ce qui atténue l'accent.`},
 acc_over:{zh:p=>`${p.cat}的${p.name}彩度 C ${p.c},超過這個風格給亮點的上限 C ${p.cap}。結構是對的,只是這個顏色連運動休閒都嫌吵。`,
  en:p=>`The ${p.cat.toLowerCase()} in ${p.name} is at C ${p.c}, past the C ${p.cap} ceiling this style gives its accent. The structure is right; the colour is loud even for athleisure.`,
  es:p=>`${p.cat} en ${p.name} está en C ${p.c}, por encima del techo de C ${p.cap} que este estilo da al acento. La estructura es correcta; el color grita incluso aquí.`,
  fr:p=>`${p.cat} en ${p.name} atteint C ${p.c}, au-delà du plafond de C ${p.cap} que ce style accorde à l'accent. La structure est bonne ; la couleur crie même ici.`},
 acc_none:{zh:p=>`全套沒有任何一件到 C ${p.base},乾淨但沒有焦點。這樣穿不會錯,只是偏居家服——加一個亮點(鞋最省事)才會像是出門的樣子。`,
  en:p=>`Nothing in the outfit reaches C ${p.base}. Clean, but there is no focal point, which reads closer to loungewear than athleisure — one accent (the shoes are the easiest) is what makes it look deliberate.`,
  es:p=>`Nada llega a C ${p.base}. Limpio, pero sin foco: se lee más como ropa de estar en casa. Un acento (lo más fácil, los zapatos) es lo que lo hace intencional.`,
  fr:p=>`Rien n'atteint C ${p.base}. Propre, mais sans point focal : cela se lit plus comme un vêtement d'intérieur. Un accent (les chaussures, le plus simple) rend l'ensemble intentionnel.`},
 acc_two:{zh:p=>`有兩件在搶焦點(${p.list})。運動休閒只給一個亮點的額度,兩個同時亮就變成配色在打架,而不是一套衣服。`,
  en:p=>`Two pieces are competing for focus (${p.list}). Athleisure budgets for one accent; two at once reads as colours fighting rather than an outfit.`,
  es:p=>`Dos prendas compiten por el foco (${p.list}). Este estilo solo presupuesta un acento; dos a la vez parecen colores peleando, no un conjunto.`,
  fr:p=>`Deux pièces se disputent le focus (${p.list}). Ce style ne budgète qu'un accent ; deux à la fois donnent des couleurs qui se battent, pas une tenue.`},
 acc_many:{zh:p=>`${p.n} 件都在說話(${p.list})。這已經不是運動休閒,是運動用品店的櫥窗。留一件,其餘換成黑、灰、白、藏青。`,
  en:p=>`${p.n} pieces are all talking (${p.list}). That is not athleisure any more, it is a sportswear shop window. Keep one and take the rest to black, grey, white or navy.`,
  es:p=>`${p.n} prendas hablan a la vez (${p.list}). Eso ya no es deportivo urbano, es un escaparate de tienda. Deja una y pasa el resto a negro, gris, blanco o marino.`,
  fr:p=>`${p.n} pièces parlent en même temps (${p.list}). Ce n'est plus du sport chic, c'est une vitrine de magasin. Gardez-en une et passez le reste au noir, gris, blanc ou marine.`},
 hue_bare:{zh:()=>`而且全套沒有一件近無彩色可以當底,兩個家族直接對話。`,
  en:()=>`There is also no near-neutral piece to sit underneath, so the two families talk to each other directly.`,
  es:()=>`Además no hay ninguna prenda casi neutra como base, así que las dos familias dialogan directamente.`,
  fr:()=>`De plus, aucune pièce quasi neutre ne sert de base : les deux familles se parlent directement.`},
 light_mid:{zh:p=>`每一件都落在中間調(L ${p.min}–${p.max}),沒有明確的明暗主從,整體會糊成一片。`,
  en:p=>`Every piece lands in the middle band (L ${p.min}–${p.max}). With no clear light-dark hierarchy the whole thing blurs together.`,
  es:p=>`Todas las prendas caen en la banda media (L ${p.min}–${p.max}). Sin jerarquía de claro-oscuro, todo se difumina.`,
  fr:p=>`Toutes les pièces tombent dans la bande médiane (L ${p.min}–${p.max}). Sans hiérarchie clair-foncé, tout se confond.`},
 light_good:{zh:p=>`明度跨度 ${p.r}(最亮 ${p.lcat}${p.lname} L ${p.max},最深 ${p.dcat}${p.dname} L ${p.min}),層次分明。`,
  en:p=>`Lightness spans ${p.r} — lightest is the ${p.lcat.toLowerCase()} in ${p.lname} at L ${p.max}, darkest the ${p.dcat.toLowerCase()} in ${p.dname} at L ${p.min}. Clear layering.`,
  es:p=>`La luminosidad abarca ${p.r}: lo más claro es ${p.lcat.toLowerCase()} en ${p.lname} (L ${p.max}), lo más oscuro ${p.dcat.toLowerCase()} en ${p.dname} (L ${p.min}). Buena estratificación.`,
  fr:p=>`La clarté couvre ${p.r} : le plus clair est ${p.lcat.toLowerCase()} en ${p.lname} (L ${p.max}), le plus foncé ${p.dcat.toLowerCase()} en ${p.dname} (L ${p.min}). Superposition nette.`},
 light_thin:{zh:p=>`明度跨度只有 ${p.r},層次偏薄。能穿,但照片上會顯得平。`,
  en:p=>`Lightness only spans ${p.r}, so the layering is thin. Wearable, but it will photograph flat.`,
  es:p=>`La luminosidad solo abarca ${p.r}: la estratificación es débil. Se puede llevar, pero en foto saldrá plano.`,
  fr:p=>`La clarté ne couvre que ${p.r} : la superposition est faible. Portable, mais plat en photo.`},
 light_mono:{zh:p=>`明度跨度 ${p.r},屬於同色調堆疊。這在${p.st}裡是成立的做法,但成敗完全押在質料差異上。`,
  en:p=>`Lightness spans ${p.r} — this is tonal stacking. A legitimate move in ${p.st}, but it lives or dies on fabric contrast.`,
  es:p=>`La luminosidad abarca ${p.r}: es apilado tonal. Es una jugada válida en ${p.st}, pero depende del contraste de tejidos.`,
  fr:p=>`La clarté couvre ${p.r} : c'est un empilement ton sur ton. Un choix valable en ${p.st}, mais tout repose sur le contraste des matières.`},
 light_flat:{zh:p=>`明度跨度只有 ${p.r},幾件顏色深淺太接近,輪廓會消失。`,
  en:p=>`Lightness only spans ${p.r}. The pieces are too close in depth and the silhouette disappears.`,
  es:p=>`La luminosidad solo abarca ${p.r}. Las prendas están demasiado próximas y la silueta desaparece.`,
  fr:p=>`La clarté ne couvre que ${p.r}. Les pièces sont trop proches et la silhouette disparaît.`},
 hue_none:{zh:()=>`全套皆為無彩或近無彩,色相衝突不存在。`,
  en:()=>`Everything is neutral or near-neutral, so there is no hue conflict to manage.`,
  es:()=>`Todo es neutro o casi neutro, así que no hay conflicto de tonos.`,
  fr:()=>`Tout est neutre ou presque, donc aucun conflit de teintes.`},
 hue_one:{zh:p=>`只有一個色相家族(${p.list}),其餘為無彩色。這是最安全的結構。`,
  en:p=>`One hue family only (${p.list}), everything else neutral. This is the safest structure there is.`,
  es:p=>`Una sola familia de tono (${p.list}), el resto neutro. La estructura más segura.`,
  fr:p=>`Une seule famille de teintes (${p.list}), le reste neutre. La structure la plus sûre.`},
 hue_two:{zh:p=>`兩個色相家族:${p.list}。兩個是上限,再加就亂。`,
  en:p=>`Two hue families: ${p.list}. Two is the ceiling — a third starts to look busy.`,
  es:p=>`Dos familias de tono: ${p.list}. Dos es el límite; una tercera ya recarga.`,
  fr:p=>`Deux familles de teintes : ${p.list}. Deux est le plafond ; une troisième surcharge.`},
 hue_many:{zh:p=>`${p.n} 個色相家族(${p.list}),超出${p.st}容納範圍。`,
  en:p=>`${p.n} hue families (${p.list}) — beyond what ${p.st} holds together.`,
  es:p=>`${p.n} familias de tono (${p.list}): más de lo que ${p.st} soporta.`,
  fr:p=>`${p.n} familles de teintes (${p.list}) — au-delà de ce que ${p.st} supporte.`},
 temp_bridge:{zh:p=>`暖(${p.warm})和冷(${p.cool})同時出現,但${p.cat}的${p.name}彩度只有 C ${p.c},能當中介把兩邊接起來。`,
  en:p=>`Warm (${p.warm}) and cool (${p.cool}) both appear, but the ${p.cat.toLowerCase()} in ${p.name} sits at only C ${p.c} and bridges the two.`,
  es:p=>`Aparecen cálidos (${p.warm}) y fríos (${p.cool}), pero ${p.cat.toLowerCase()} en ${p.name} está en solo C ${p.c} y hace de puente.`,
  fr:p=>`Chaud (${p.warm}) et froid (${p.cool}) coexistent, mais ${p.cat.toLowerCase()} en ${p.name} n'est qu'à C ${p.c} et fait le lien.`},
 temp_clash:{zh:p=>`暖(${p.warm})和冷(${p.cool})直接相撞,沒有近無彩色做橋接,會顯得兩截。`,
  en:p=>`Warm (${p.warm}) meets cool (${p.cool}) with no near-neutral to bridge them — the look splits in two.`,
  es:p=>`Cálido (${p.warm}) choca con frío (${p.cool}) sin neutro que los una: el conjunto se parte en dos.`,
  fr:p=>`Le chaud (${p.warm}) heurte le froid (${p.cool}) sans neutre pour relier — la tenue se coupe en deux.`},
 temp_warm:{zh:p=>`全套暖調一致(${p.list}加無彩色),膚色會被拉亮。`,
  en:p=>`Consistently warm (${p.list} plus neutrals), which lifts skin tone.`,
  es:p=>`Cálido de forma coherente (${p.list} más neutros), lo que favorece el tono de piel.`,
  fr:p=>`Chaud de façon cohérente (${p.list} plus neutres), ce qui éclaire le teint.`},
 temp_cool:{zh:p=>`全套冷調一致(${p.list}加無彩色),俐落收斂。`,
  en:p=>`Consistently cool (${p.list} plus neutrals) — sharp and contained.`,
  es:p=>`Frío de forma coherente (${p.list} más neutros): nítido y contenido.`,
  fr:p=>`Froid de façon cohérente (${p.list} plus neutres) — net et maîtrisé.`},
 temp_pref_ok:{zh:p=>`${p.st}要的就是暖調,而${p.list}正好走在這個方向上。`,
  en:p=>`${p.st} wants warmth, and ${p.list} runs exactly that way.`,
  es:p=>`${p.st} pide calidez, y ${p.list} va justo en esa dirección.`,
  fr:p=>`${p.st} demande de la chaleur, et ${p.list} va exactement dans ce sens.`},
 temp_pref_bad:{zh:p=>`${p.st}以暖調為骨架,但這一套的顏色(${p.list})是冷的。不是不能穿,而是換了風格就該換一套判斷。`,
  en:p=>`${p.st} is built on warm tones, but this outfit runs cool (${p.list}). Not unwearable — it just belongs to a different style.`,
  es:p=>`${p.st} se construye sobre tonos cálidos, pero este conjunto es frío (${p.list}). No es imposible de llevar: simplemente pertenece a otro estilo.`,
  fr:p=>`${p.st} repose sur des tons chauds, mais cette tenue est froide (${p.list}). Pas importable — elle appartient simplement à un autre style.`},
 temp_pref_none:{zh:p=>`全套是無彩色骨架,${p.st}成立但少了這個風格最想要的暖度。加一件燕麥或駝色就到位。`,
  en:p=>`The outfit is an achromatic frame. It holds up, but it lacks the warmth ${p.st} is really after — one oatmeal or camel piece would fix it.`,
  es:p=>`El conjunto es un marco acromático. Funciona, pero le falta la calidez que ${p.st} busca: una prenda avena o camel lo resolvería.`,
  fr:p=>`La tenue est une structure achromatique. Elle tient, mais il manque la chaleur que ${p.st} recherche — une pièce avoine ou camel suffirait.`},
 temp_neutral:{zh:()=>`全套無明顯冷暖傾向,不存在色溫衝突。`,
  en:()=>`No clear warm or cool bias, so there is no temperature conflict.`,
  es:()=>`Sin sesgo cálido o frío claro, así que no hay conflicto de temperatura.`,
  fr:()=>`Aucun biais chaud ou froid marqué, donc pas de conflit de température.`},
 shoe_good:{zh:p=>`鞋(${p.name} L ${p.l})是全身最深或並列最深,重心穩定收在下方。`,
  en:p=>`The shoes (${p.name}, L ${p.l}) are the darkest point or tied for it, so the weight settles at the bottom.`,
  es:p=>`Los zapatos (${p.name}, L ${p.l}) son el punto más oscuro, así que el peso se asienta abajo.`,
  fr:p=>`Les chaussures (${p.name}, L ${p.l}) sont le point le plus foncé, le poids se pose en bas.`},
 shoe_ok:{zh:p=>`鞋(${p.name} L ${p.l})比下身亮一些,收束不夠明確但還撐得住。`,
  en:p=>`The shoes (${p.name}, L ${p.l}) are a touch lighter than the bottom — the anchor is vague but it holds.`,
  es:p=>`Los zapatos (${p.name}, L ${p.l}) son algo más claros que el pantalón: el anclaje es débil pero aguanta.`,
  fr:p=>`Les chaussures (${p.name}, L ${p.l}) sont un peu plus claires que le bas : l'ancrage est flou mais tient.`},
 shoe_echo:{zh:p=>`鞋(${p.name} L ${p.l})比下身亮,但${p.cat}的${p.ename}(L ${p.el})在上面呼應了同一個亮度,腳下那一塊白不是孤立的亮點,而是把視線帶回上半身。小白鞋就是靠這個成立的。`,
  en:p=>`The shoes (${p.name}, L ${p.l}) are lighter than the bottom, but the ${p.cat.toLowerCase()} in ${p.ename} (L ${p.el}) repeats that brightness above. The light at the foot isn't an orphan — it sends the eye back up. This is exactly why white trainers work.`,
  es:p=>`Los zapatos (${p.name}, L ${p.l}) son más claros que el pantalón, pero ${p.cat.toLowerCase()} en ${p.ename} (L ${p.el}) repite ese brillo arriba. La luz del pie no queda huérfana: devuelve la mirada hacia arriba. Por eso funcionan las deportivas blancas.`,
  fr:p=>`Les chaussures (${p.name}, L ${p.l}) sont plus claires que le bas, mais ${p.cat.toLowerCase()} en ${p.ename} (L ${p.el}) reprend cette clarté en haut. La lumière au pied n'est pas orpheline : elle ramène l'œil vers le haut. C'est précisément pour cela que les baskets blanches fonctionnent.`},
 shoe_bad:{zh:p=>`鞋(${p.name} L ${p.l})明顯比上下身亮,而且上半身沒有任何一件接近這個亮度來呼應,腳下會變成孤立的亮點。`,
  en:p=>`The shoes (${p.name}, L ${p.l}) are clearly lighter than both top and bottom, and nothing above comes close to that brightness, so the foot becomes an isolated bright spot.`,
  es:p=>`Los zapatos (${p.name}, L ${p.l}) son claramente más claros que el resto y nada arriba se acerca a ese brillo, así que el pie queda como un punto luminoso aislado.`,
  fr:p=>`Les chaussures (${p.name}, L ${p.l}) sont nettement plus claires que le reste et rien au-dessus n'approche cette clarté : le pied devient un point lumineux isolé.`},
 shoe_accent:{zh:p=>`鞋(${p.name} C ${p.c})就是全身唯一的亮點,上下身都在當底。腳下那塊顏色比下身亮在這個風格不是失誤,是設計——視線落在鞋上是刻意的。`,
  en:p=>`The shoes (${p.name}, C ${p.c}) are the only accent in the outfit, with top and bottom holding the base. Being brighter than the bottom is not a mistake here, it is the design — the eye is meant to land on the shoes.`,
  es:p=>`Los zapatos (${p.name}, C ${p.c}) son el único acento, con arriba y abajo como base. Ser más claros que el pantalón no es un error aquí, es el diseño: la mirada debe caer en el calzado.`,
  fr:p=>`Les chaussures (${p.name}, C ${p.c}) sont le seul accent, le haut et le bas tenant la base. Être plus claires que le bas n'est pas une erreur ici, c'est le principe : l'œil doit se poser sur la chaussure.`},
 shoe_pop:{zh:p=>`鞋(${p.name} L ${p.l})是乾淨的淺色,在深色底上當視覺斷點。運動休閒本來就這樣穿,小白鞋不需要上半身呼應也成立。`,
  en:p=>`The shoes (${p.name}, L ${p.l}) are a clean light tone punctuating a darker base. That is how athleisure is actually worn — white trainers hold up here without needing an echo above.`,
  es:p=>`Los zapatos (${p.name}, L ${p.l}) son un tono claro limpio que puntúa una base oscura. Así se lleva de verdad este estilo: las deportivas blancas funcionan sin necesitar eco arriba.`,
  fr:p=>`Les chaussures (${p.name}, L ${p.l}) sont un ton clair net qui ponctue une base sombre. C'est ainsi que le sport chic se porte — les baskets blanches tiennent sans écho au-dessus.`},
 shoe_muddy:{zh:p=>`鞋(${p.name} L ${p.l})既不深到能收束,也不亮到能當亮點,彩度又不夠成為焦點。這個風格最怕這種中間值——換成全黑、乾淨白,或是一雙有顏色的球鞋。`,
  en:p=>`The shoes (${p.name}, L ${p.l}) are neither dark enough to anchor nor light enough to punctuate, and not chromatic enough to be the accent. This in-between is the worst case for this style — go full black, clean white, or a genuinely coloured trainer.`,
  es:p=>`Los zapatos (${p.name}, L ${p.l}) no son lo bastante oscuros para anclar ni lo bastante claros para puntuar, y tampoco tienen croma para ser el acento. Ese punto medio es lo peor para este estilo: ve a negro, blanco limpio o una deportiva con color de verdad.`,
  fr:p=>`Les chaussures (${p.name}, L ${p.l}) ne sont ni assez foncées pour ancrer, ni assez claires pour ponctuer, ni assez chromatiques pour être l'accent. Cet entre-deux est le pire cas ici : noir franc, blanc net, ou une basket vraiment colorée.`},
 fix_accent:{zh:p=>`亮點的額度只有一個。決定要留哪一件說話——鞋最安全,因為面積小、換起來也最便宜——其餘全部換成黑、炭灰、中灰、純白或藏青。彩度控制在 C ${p.base} 以下就算底。`,
  en:p=>`You get one accent. Decide which piece speaks — the shoes are the safest choice, small in area and the cheapest to swap — and take everything else to black, charcoal, mid grey, white or navy. Under C ${p.base} counts as base.`,
  es:p=>`Tienes un solo acento. Decide qué prenda habla — los zapatos son lo más seguro, poca superficie y lo más barato de cambiar — y lleva el resto a negro, carbón, gris medio, blanco o marino. Por debajo de C ${p.base} cuenta como base.`,
  fr:p=>`Vous avez droit à un seul accent. Choisissez la pièce qui parle — la chaussure est le choix le plus sûr, petite surface et le moins cher à remplacer — et passez tout le reste au noir, anthracite, gris moyen, blanc ou marine. Sous C ${p.base}, c'est de la base.`},
 fix_acc_none:{zh:p=>`結構是乾淨的,缺的是一個焦點。最省事的是換一雙有顏色的球鞋,面積小、風險低;不想動鞋就把上衣換成飽和度夠的一件(C ${p.base} 以上)。只要記得其餘全部留在無彩色。${p.busy?`不過順序要對:現在當底的幾件平均彩度 C ${p.mean},底自己在說話,先把它們壓成黑、灰、白、藏青,再放亮點才看得出來。`:``}`,
  en:p=>`The structure is clean; what's missing is a focal point. The cheapest move is a coloured trainer — small area, low risk. If you'd rather not change shoes, take the top to something genuinely saturated (C ${p.base} or more) and keep everything else neutral.${p.busy?` Order matters, though: the base pieces currently average C ${p.mean}, so the base is talking too — quiet them to black, grey, white or navy first, or the accent won't read.`:``}`,
  es:p=>`La estructura está limpia; falta un foco. Lo más barato es una deportiva con color: poca superficie, poco riesgo. Si prefieres no cambiar el calzado, lleva la parte superior a algo realmente saturado (C ${p.base} o más) y deja el resto neutro.${p.busy?` El orden importa: las prendas de base promedian ahora C ${p.mean}, así que la base también habla — pásalas primero a negro, gris, blanco o marino o el acento no se leerá.`:``}`,
  fr:p=>`La structure est propre ; il manque un point focal. Le plus simple est une basket colorée — petite surface, peu de risque. Sinon, passez le haut à une couleur vraiment saturée (C ${p.base} ou plus) et gardez le reste neutre.${p.busy?` L'ordre compte : les pièces de base sont à C ${p.mean} en moyenne, la base parle aussi — passez-les d'abord au noir, gris, blanc ou marine, sinon l'accent ne se lira pas.`:``}`},
 fix_acc_over:{zh:p=>`結構對了,只是這個顏色連運動休閒都嫌吵(超過 C ${p.cap})。同色系降一階就好——正紅換酒紅、亮橘換陶土、亮粉換淺粉,或把它搬到鞋上,面積小就吵不起來。`,
  en:p=>`The structure is right; the colour is loud even for this style (past C ${p.cap}). Drop one step within the same hue — red to wine, orange to terracotta, hot pink to pale pink — or move it onto the shoes, where the small area keeps it in check.`,
  es:p=>`La estructura es correcta; el color grita incluso aquí (pasa de C ${p.cap}). Baja un paso dentro del mismo tono — rojo a vino, naranja a terracota, rosa fuerte a rosa pálido — o pásalo al calzado, donde la poca superficie lo contiene.`,
  fr:p=>`La structure est bonne ; la couleur crie même ici (au-delà de C ${p.cap}). Descendez d'un cran dans la même teinte — rouge vers bordeaux, orange vers terre cuite, rose vif vers rose pâle — ou déplacez-la sur la chaussure, où la petite surface la contient.`},
 fix_acc_base:{zh:p=>`亮點只有一個是對的,但當底的幾件自己也在說話(平均 C ${p.mean})。把它們換成黑、炭灰、中灰、純白或藏青,平均壓到 ${p.max} 以下,亮點才會被看見。`,
  en:p=>`One accent is correct, but the pieces underneath are talking too (average C ${p.mean}). Take them to black, charcoal, mid grey, white or navy so the average drops under ${p.max} and the accent can actually be seen.`,
  es:p=>`Un solo acento es correcto, pero las prendas de base también hablan (media C ${p.mean}). Pásalas a negro, carbón, gris medio, blanco o marino para bajar la media de ${p.max} y que el acento se vea.`,
  fr:p=>`Un seul accent, c'est juste, mais les pièces en dessous parlent aussi (moyenne C ${p.mean}). Passez-les au noir, anthracite, gris moyen, blanc ou marine pour descendre sous ${p.max} et laisser l'accent se voir.`},
 fix_shoe_sport:{zh:()=>`鞋在這個風格是主角,不要選中間調。三條路:全黑或近黑把重心收在下方、乾淨的白或淺灰當斷點、或者讓鞋成為全身唯一的亮點(這時上下身必須都是無彩色)。`,
  en:()=>`Shoes carry this style, so don't leave them mid-tone. Three routes: full black or off-black to settle the weight, clean white or light grey as punctuation, or let the shoe be the outfit's only accent — in which case top and bottom must both stay neutral.`,
  es:()=>`El calzado lleva este estilo, así que no lo dejes en tono medio. Tres caminos: negro o casi negro para asentar el peso, blanco limpio o gris claro como puntuación, o que el zapato sea el único acento — y entonces arriba y abajo deben quedarse neutros.`,
  fr:()=>`La chaussure porte ce style, ne la laissez pas en demi-teinte. Trois voies : noir ou presque noir pour poser le poids, blanc net ou gris clair comme ponctuation, ou faire de la chaussure le seul accent — auquel cas le haut et le bas restent neutres.`},
 fix_none:{zh:()=>`每一條都過,不需要改。`,en:()=>`Every rule passes. Nothing to change.`,
  es:()=>`Todas las reglas pasan. Nada que cambiar.`,fr:()=>`Toutes les règles passent. Rien à changer.`},
 fix_chroma:{zh:p=>`把${p.cat}的${p.name}換成同色系的低彩度版本,或直接換無彩色。彩度是${p.st}最容易破功的一項。`,
  en:p=>`Swap the ${p.cat.toLowerCase()} in ${p.name} for a duller version of the same hue, or go neutral. Chroma is where ${p.st} breaks first.`,
  es:p=>`Cambia ${p.cat.toLowerCase()} en ${p.name} por una versión más apagada del mismo tono, o ve a neutro. El croma es lo primero que rompe ${p.st}.`,
  fr:p=>`Remplacez ${p.cat.toLowerCase()} en ${p.name} par une version plus sourde de la même teinte, ou passez au neutre. Le chroma est le premier point de rupture.`},
 fix_light_mid:{zh:p=>`每一件都在中間調。挑一件往淺推(奶油白、象牙、淺灰),或把下身換成藏青、炭灰,拉出至少 ${p.tgt} 的明度差。`,
  en:p=>`Everything is mid-tone. Push one piece light (cream, ivory, light grey) or take the bottom down to navy or charcoal, until the spread reaches ${p.tgt}.`,
  es:p=>`Todo está en tono medio. Lleva una prenda a claro (crema, marfil, gris claro) o el pantalón a azul marino o carbón, hasta alcanzar ${p.tgt} de diferencia.`,
  fr:p=>`Tout est en demi-teinte. Éclaircissez une pièce (crème, ivoire, gris clair) ou passez le bas en marine ou anthracite, jusqu'à ${p.tgt} d'écart.`},
 fix_light:{zh:p=>`把下身換深一階、或上衣換淺一階,目標是全套明度跨度到 ${p.tgt} 以上。`,
  en:p=>`Take the bottom one step darker or the top one step lighter, aiming for a lightness spread above ${p.tgt}.`,
  es:p=>`Oscurece el pantalón un paso o aclara la parte superior un paso, buscando más de ${p.tgt} de diferencia.`,
  fr:p=>`Assombrissez le bas d'un cran ou éclaircissez le haut d'un cran, pour dépasser ${p.tgt} d'écart.`},
 fix_hue:{zh:p=>`留下最想穿的那一個色相,其餘換成無彩色或米駝系。${p.st}的層次來自質料,不來自多色。`,
  en:p=>`Keep the one hue you actually want to wear and take the rest to neutrals or the camel family. ${p.st} layers with fabric, not with colour count.`,
  es:p=>`Quédate con el tono que de verdad quieres y pasa el resto a neutros o a la familia camel. ${p.st} estratifica con tejidos, no con más colores.`,
  fr:p=>`Gardez la teinte que vous voulez vraiment et passez le reste en neutres ou en camel. ${p.st} superpose par la matière, pas par le nombre de couleurs.`},
 fix_temp:{zh:()=>`加一件低彩度的中灰或燕麥色當橋接(外套或下身最有效),或把其中一件換成同色溫。`,
  en:()=>`Add a low-chroma mid grey or oatmeal as a bridge — the outer layer or the bottom works best — or move one piece to match the other's temperature.`,
  es:()=>`Añade un gris medio u avena de croma bajo como puente (mejor el abrigo o el pantalón), o cambia una prenda a la misma temperatura.`,
  fr:()=>`Ajoutez un gris moyen ou un avoine peu chromatique comme pont (la veste ou le bas fonctionne mieux), ou alignez une pièce sur la température de l'autre.`},
 fix_temp_pref:{zh:p=>`${p.st}的底色是暖的。把其中一件換成燕麥、駝色、摩卡或橄欖,整套的調性就會回到這個風格上。`,
  en:p=>`${p.st} sits on a warm base. Move one piece to oatmeal, camel, mocha or olive and the whole outfit comes back into the style.`,
  es:p=>`${p.st} se asienta sobre una base cálida. Cambia una prenda a avena, camel, moca u oliva y el conjunto vuelve al estilo.`,
  fr:p=>`${p.st} repose sur une base chaude. Passez une pièce en avoine, camel, moka ou olive et la tenue revient dans le style.`},
 fix_shoe:{zh:()=>`兩條路。想留住這雙淺色鞋,就在上半身放一件亮度接近的淺色——白襯衫、奶油白針織、米色外套都算,讓腳下那塊亮有東西呼應。不想動上半身,就把鞋換成全套最深的一階:黑、近黑、深巧克力,依上身色溫選。`,
  en:()=>`Two routes. To keep the light shoes, put something of a similar brightness on top — a white shirt, a cream knit, a beige jacket — so the light at the foot has an echo. If you'd rather not touch the top half, take the shoes to the darkest step in the outfit: black, off-black or dark chocolate, whichever matches the temperature above.`,
  es:()=>`Dos caminos. Para conservar los zapatos claros, pon arriba algo de brillo similar: una camisa blanca, un punto crema, una chaqueta beige, para que la luz del pie tenga eco. Si prefieres no tocar la parte de arriba, lleva los zapatos al tono más oscuro del conjunto: negro, casi negro o chocolate oscuro, según la temperatura.`,
  fr:()=>`Deux options. Pour garder les chaussures claires, placez en haut une pièce de clarté voisine — chemise blanche, maille crème, veste beige — afin que la lumière au pied trouve un écho. Sinon, passez les chaussures au ton le plus foncé de la tenue : noir, presque noir ou chocolat foncé, selon la température du haut.`},
 note_same:{zh:p=>`${p.a}和${p.b}同為${p.f}且明度幾乎相同,相疊會失去層次。把其中一件換成不同織法。`,
  en:p=>`${p.a} and ${p.b} are both ${p.f.toLowerCase()} at almost the same lightness — layered together they lose all definition. Change one to a different weave.`,
  es:p=>`${p.a} y ${p.b} son ambos ${p.f.toLowerCase()} con casi la misma luminosidad: superpuestos pierden definición. Cambia uno de tejido.`,
  fr:p=>`${p.a} et ${p.b} sont tous deux en ${p.f.toLowerCase()} avec presque la même clarté : superposés, ils perdent toute définition. Changez le tissage de l'un.`},
 sub_one:{zh:p=>`${p.cat}的${p.name}(C ${p.c})超出${p.st}色域。同一個位置最接近的替代是${p.alt}——色相相近、明度相當,彩度降到 C ${p.ac}。想保留這件的話就讓它當全身唯一的聲音,其餘全部無彩色。`,
  en:p=>`The ${p.cat.toLowerCase()} in ${p.name} (C ${p.c}) sits outside the ${p.st} range. The closest substitute in the same position is ${p.alt} — similar hue, similar lightness, chroma down to C ${p.ac}. If you want to keep the original, let it be the only voice in the outfit and take everything else to neutrals.`,
  es:p=>`${p.cat} en ${p.name} (C ${p.c}) está fuera de la gama de ${p.st}. El sustituto más cercano en la misma posición es ${p.alt}: tono y luminosidad similares, croma reducido a C ${p.ac}. Si quieres conservar la prenda, que sea la única voz del conjunto y deja el resto en neutros.`,
  fr:p=>`${p.cat} en ${p.name} (C ${p.c}) sort de la gamme de ${p.st}. Le substitut le plus proche à la même place est ${p.alt} — teinte et clarté similaires, chroma ramené à C ${p.ac}. Pour garder la pièce, faites-en la seule voix de la tenue et passez tout le reste en neutres.`},
 note_fab:{zh:p=>`${p.n} 種質料(${p.list})在低彩度下撐起層次,這正是${p.st}的做法。`,
  en:p=>`${p.n} different fabrics (${p.list}) carrying the layering at low chroma — exactly how ${p.st} works.`,
  es:p=>`${p.n} tejidos distintos (${p.list}) sostienen la estratificación con croma bajo: así funciona ${p.st}.`,
  fr:p=>`${p.n} matières différentes (${p.list}) portent la superposition à faible chroma — c'est précisément le principe de ${p.st}.`}
};

let L="zh";
try{ L=localStorage.getItem("ql_lang")||"zh"; }catch(e){}
if(!LANGS.includes(L)) L="zh";
const u=k=>UI[k][L];
const cn=hex=>{const o=CNAME[hex.toUpperCase()];return o?o[L]:hex;};
const cat=k=>{const o=CATS.find(c=>c.k===k);return o?o[L]:k;};
const fab=k=>{if(!k)return "";const o=FABRICS.find(f=>f.k===k);return o?o[L]:k;};
// the style name is injected into every message, so rule text names the active style
const m=(id,p)=>MSG[id][L](Object.assign({st:ST().name[L]},p||{}));

/* ===================== colour math ===================== */
function hexToRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lin(v){v/=255;return v<=0.04045? v/12.92 : Math.pow((v+0.055)/1.055,2.4);}
function lch(hex){
  const [R,G,B]=hexToRgb(hex), r=lin(R),g=lin(G),b=lin(B);
  const X=r*0.4124564+g*0.3575761+b*0.1804375;
  const Y=r*0.2126729+g*0.7151522+b*0.0721750;
  const Z=r*0.0193339+g*0.1191920+b*0.9503041;
  const f=t=>t>0.008856? Math.cbrt(t) : (7.787*t+16/116);
  const fx=f(X/0.95047), fy=f(Y/1), fz=f(Z/1.08883);
  const Lv=116*fy-16, a=500*(fx-fy), bb=200*(fy-fz);
  let H=Math.atan2(bb,a)*180/Math.PI; if(H<0)H+=360;
  return {L:+Lv.toFixed(1), C:+Math.sqrt(a*a+bb*bb).toFixed(1), H:+H.toFixed(1)};
}
function hueDist(a,b){const d=Math.abs(a-b)%360;return d>180?360-d:d;}
// closest quiet-luxury colour to a given hex: hold hue and lightness, drop chroma
function nearestQuiet(hex){
  const a=lch(hex); let best=null,bd=1e9;
  QUIET.forEach(h=>{
    const b=lch(h);
    let d=1.4*Math.abs(a.L-b.L)+1.0*hueDist(a.H,b.H);
    // a chromatic garment should be replaced by something that still has a colour,
    // not flattened straight to grey
    if(a.C>=25) d+=0.9*Math.max(0,12-b.C);
    if(d<bd){bd=d;best=h;}
  });
  return best;
}
function temp(H,C){ if(C<10) return "neutral";
  return lean(H,C); }
// temperature *direction*, ignoring the near-neutral cut-off: a cream at C 5.6 still
// leans warm, which matters for styles that ask for a temperature rather than just consistency
function lean(H,C){ if(C<3.5) return "none";
  if(H<=115||H>=335) return "warm";
  if(H>=150&&H<=310) return "cool";
  return "mid"; }

/* ===================== scoring ===================== */
function scoreLook(items){
  const its=items.map(o=>Object.assign({},o,lch(o.hex),{cname:cn(o.hex),catName:cat(o.cat)}));
  if(its.length<2) return null;
  const rules=[], S=ST();   // every threshold and weight below comes from the active style
  const C=S.chroma, LT=S.light, HU=S.hue, TP=S.temp, W=S.w;

  const maxC=Math.max(...its.map(i=>i.C));
  const meanC=+(its.reduce((s,i)=>s+i.C,0)/its.length).toFixed(1);
  const loud=its.slice().sort((a,b)=>b.C-a.C)[0];
  let r;
  // ---- rule 1, two possible shapes ----
  // most styles police a ceiling: nothing may be loud. athleisure polices a budget:
  // exactly one piece may be loud, and it is allowed to be much louder than any
  // ceiling style would permit. A is null for the ceiling styles.
  const A=S.accent||null;
  // "loud" is a real accent, not merely a colour: navy, olive, denim and sage are base
  // colours in sportswear, so the budget only counts pieces at or above A.loud
  const louds=A?its.filter(i=>i.C>=A.loud).sort((a,b)=>b.C-a.C):[];
  const accentItem=A&&louds.length===1?louds[0]:null;
  let accCase="ok", accMean=0;
  if(A){
    const n=louds.length;
    const rest=its.filter(i=>louds.indexOf(i)<0);
    const baseMean=rest.length?+(rest.reduce((s,i)=>s+i.C,0)/rest.length).toFixed(1):0;
    accMean=baseMean;
    if(n===0){ r=[A.none,"warn","acc_none",{base:A.loud}]; accCase="none"; }
    else if(n===1) r=louds[0].C<=A.cap
      ?[1,"good","acc_one",{cat:louds[0].catName,name:louds[0].cname,c:louds[0].C,loud:A.loud}]
      :(accCase="over",[A.over,"warn","acc_over",{cat:louds[0].catName,name:louds[0].cname,c:louds[0].C,cap:A.cap}]);
    else if(n===2){ r=[A.two,"bad","acc_two",{list:louds.map(i=>i.catName+" "+i.cname+" C "+i.C).join(" · ")}]; accCase="many"; }
    else { r=[A.many,"bad","acc_many",{n,list:louds.map(i=>i.cname).join(" / ")}]; accCase="many"; }
    let aTxt=m(r[2],r[3]), aRatio=r[0], aV=r[1];
    // the base has to actually be a base: a "one accent" outfit over a busy base isn't one
    if(rest.length&&baseMean>A.baseMax){
      aRatio=+(aRatio*0.7).toFixed(3); if(aV==="good")aV="warn";
      aTxt+=" "+m("acc_base",{mean:baseMean,max:A.baseMax});
      if(accCase==="ok") accCase="base";
    }
    rules.push({key:"accent",name:u("rAccent"),w:W.chroma,ratio:aRatio,v:aV,txt:aTxt});
  } else {
  if(maxC<=C.good) r=[1,"good","chroma_good",{c:maxC}];
  else if(maxC<=C.ok) r=[0.72,"warn","chroma_ok",{cat:loud.catName,name:loud.cname,c:maxC}];
  else if(maxC<=C.high) r=[0.4,"warn","chroma_high",{cat:loud.catName,name:loud.cname,c:maxC}];
  else r=[0.12,"bad","chroma_bad",{cat:loud.catName,name:loud.cname,c:maxC}];
  let cTxt=m(r[2],r[3]), cRatio=r[0], cV=r[1];
  if(meanC>C.meanBad){ cRatio=+(cRatio*0.5).toFixed(3); cV="bad";
    if(maxC<=C.high) cTxt=m("chroma_high",{cat:loud.catName,name:loud.cname,c:maxC});
    cTxt+=" "+m("chroma_mean",{mean:meanC}); }
  else if(meanC>C.meanWarn){ cRatio=+(cRatio*0.7).toFixed(3); if(cV==="good")cV="warn"; cTxt+=" "+m("chroma_mean",{mean:meanC}); }
  rules.push({key:"chroma",name:u("rChroma"),w:W.chroma,ratio:cRatio,v:cV,txt:cTxt});
  }

  // lightness is read from the garments only — shoes anchor the look but must not
  // be allowed to "create" a lightness range that the clothes themselves don't have
  let gar=its.filter(i=>i.cat!=="shoe");
  if(gar.length<2) gar=its;
  const Ls=gar.map(i=>i.L), maxL=Math.max(...Ls), minL=Math.min(...Ls), range=+(maxL-minL).toFixed(1);
  const allMid=gar.every(i=>i.L>=LT.midLo&&i.L<=LT.midHi);
  // the tonal-stacking exemption asks whether the *clothes* are quiet. a bright shoe
  // is already excluded from the span above, so it must not disqualify them either
  const garMaxC=Math.max(...gar.map(i=>i.C));
  const lightest=gar.find(i=>i.L===maxL), darkest=gar.find(i=>i.L===minL);
  if(allMid) r=[0.3,"bad","light_mid",{min:minL,max:maxL}];
  else if(range>=LT.good) r=[1,"good","light_good",{r:range,lcat:lightest.catName,lname:lightest.cname,max:maxL,dcat:darkest.catName,dname:darkest.cname,min:minL}];
  else if(range>=LT.thin) r=[0.62,"warn","light_thin",{r:range}];
  else if(garMaxC<=LT.monoMaxC) r=[0.55,"warn","light_mono",{r:range}];
  else r=[0.25,"bad","light_flat",{r:range}];
  rules.push({key:"light",name:u("rLight"),w:W.light,ratio:r[0],v:r[1],txt:m(r[2],r[3])});

  const chrom=its.filter(i=>i.C>=10), fams=[];
  chrom.forEach(i=>{const f=fams.find(x=>hueDist(x.H,i.H)<=40); if(f)f.n.push(i); else fams.push({H:i.H,n:[i]});});
  const famTxt=fams.map(f=>f.n.map(x=>x.cname).join(" / ")).join(" · ");
  if(fams.length===0) r=[1,"good","hue_none",{}];
  else if(fams.length===1) r=[1,"good","hue_one",{list:famTxt}];
  else if(fams.length===2) r=[HU.two,HU.two>=0.8?"good":"warn","hue_two",{list:famTxt}];
  else r=[HU.many,"bad","hue_many",{n:fams.length,list:famTxt}];
  let hTxt=m(r[2],r[3]), hRatio=r[0], hV=r[1];
  const anchors=its.filter(i=>i.C<8).length;
  if(fams.length>=2&&anchors===0){ hRatio=+(hRatio*HU.bareMult).toFixed(3); hV="bad"; hTxt+=" "+m("hue_bare"); }
  rules.push({key:"hue",name:u("rHue"),w:W.hue,ratio:hRatio,v:hV,txt:hTxt});

  const ts=its.map(i=>({i,t:temp(i.H,i.C)}));
  const warms=ts.filter(x=>x.t==="warm").map(x=>x.i), cools=ts.filter(x=>x.t==="cool").map(x=>x.i);
  const bridge=its.find(i=>i.C<8);
  const wl=warms.map(x=>x.cname).join(" / "), cl=cools.map(x=>x.cname).join(" / ");
  let tempPrefMiss=false;
  if(warms.length&&cools.length){
    if(bridge) r=[0.72,"warn","temp_bridge",{warm:wl,cool:cl,cat:bridge.catName,name:bridge.cname,c:bridge.C}];
    else r=[0.35,"bad","temp_clash",{warm:wl,cool:cl}];
  } else if(warms.length) r=[1,"good","temp_warm",{list:wl}];
  else if(cools.length) r=[1,"good","temp_cool",{list:cl}];
  else r=[1,"good","temp_neutral",{}];
  // styles with a stated temperature preference judge direction, not just consistency.
  // it reads the hue lean rather than temp(), so a cream at C 5.6 still counts as warm
  // and a mint at C 30 can't slip through as "neutral"
  if(TP.prefer==="warm"){
    const leans=its.map(i=>({i,t:lean(i.H,i.C)}));
    const warmish=leans.filter(x=>x.t==="warm").map(x=>x.i);
    const against=leans.filter(x=>(x.t==="cool"||x.t==="mid")&&x.i.C>=8).map(x=>x.i);
    const al=against.map(x=>x.cname).join(" / "), wl2=warmish.map(x=>x.cname).join(" / ");
    if(warmish.length&&against.length){
      if(bridge) r=[0.6,"warn","temp_bridge",{warm:wl2,cool:al,cat:bridge.catName,name:bridge.cname,c:bridge.C}];
      else r=[0.35,"bad","temp_clash",{warm:wl2,cool:al}];
    } else if(against.length){ r=[0.3,"bad","temp_pref_bad",{list:al}]; tempPrefMiss=true; }
    else if(warmish.length) r=[1,"good","temp_pref_ok",{list:wl2}];
    else { r=[0.68,"warn","temp_pref_none",{}]; tempPrefMiss=true; }
  }
  rules.push({key:"temp",name:u("rTemp"),w:W.temp,ratio:r[0],v:r[1],txt:m(r[2],r[3])});

  const shoe=its.find(i=>i.cat==="shoe");
  let shoeEcho=null;
  if(shoe){
    const SH=S.shoe, body=its.filter(i=>i.cat==="top"||i.cat==="bottom");
    const minBody=Math.min(...body.map(i=>i.L));
    // a light shoe is only an orphan if nothing above repeats its brightness. white
    // trainers under a white shirt read as an echo, which is why they work in practice
    shoeEcho=its.filter(i=>i.cat!=="shoe").find(i=>Math.abs(i.L-shoe.L)<=SH.echo)||null;
    // in athleisure the shoe has two extra legitimate roles beyond anchoring:
    // it can be the outfit's single chroma accent, or a clean light punctuation
    // against a dark base — a white trainer under all-black needs no echo above
    const shoeIsAccent=!!(accentItem&&accentItem.cat==="shoe");
    const shoePops=!!(SH.pop&&shoe.C<=SH.popC&&shoe.L>=SH.pop);
    if(shoeIsAccent) r=[1,"good","shoe_accent",{name:shoe.cname,c:shoe.C}];
    else if(shoe.L<=minBody+SH.near) r=[1,"good","shoe_good",{name:shoe.cname,l:shoe.L}];
    else if(shoePops) r=[1,"good","shoe_pop",{name:shoe.cname,l:shoe.L}];
    else if(shoeEcho) r=[SH.echoR,SH.echoR>=0.85?"good":"warn","shoe_echo",
      {name:shoe.cname,l:shoe.L,cat:shoeEcho.catName,ename:shoeEcho.cname,el:shoeEcho.L}];
    else if(shoe.L<=minBody+SH.mid) r=[0.6,"warn","shoe_ok",{name:shoe.cname,l:shoe.L}];
    else r=[SH.fail,"bad",SH.pop?"shoe_muddy":"shoe_bad",{name:shoe.cname,l:shoe.L}];
    rules.push({key:"shoe",name:u("rShoe"),w:W.shoe,ratio:r[0],v:r[1],txt:m(r[2],r[3])});
  }

  const wsum=rules.reduce((s,x)=>s+x.w,0);
  let total=Math.round(rules.reduce((s,x)=>s+x.ratio*x.w,0)/wsum*100);
  // one hard failure must not be averaged away by four passes
  const worstRatio=Math.min(...rules.map(x=>x.ratio));
  if(worstRatio<=0.3) total=Math.min(total,58);
  else if(worstRatio<=0.6) total=Math.min(total,72);

  const notes=[];
  for(let k=0;k<its.length-1;k++){
    const a=its[k],b=its[k+1];
    if(a.fabric&&b.fabric&&a.fabric===b.fabric&&Math.abs(a.L-b.L)<12)
      notes.push(m("note_same",{a:a.catName,b:b.catName,f:fab(a.fabric)}));
  }
  const fabs=[...new Set(its.map(i=>i.fabric).filter(Boolean))];
  if(fabs.length>=3&&(A||maxC<=C.ok)) notes.push(m("note_fab",{n:fabs.length,list:fabs.map(fab).join(" / ")}));
  // never suggest muting the one piece the style deliberately allows to be loud
  its.filter(i=>i.C>C.ok&&i!==accentItem).forEach(i=>{
    const alt=nearestQuiet(i.hex), av=lch(alt);
    notes.push(m("sub_one",{cat:i.catName,name:i.cname,c:i.C,alt:cn(alt),ac:av.C}));
  });

  const worst=rules.slice().sort((a,b)=>a.ratio-b.ratio)[0];
  let fix;
  if(worst.ratio>=0.95) fix=m("fix_none");
  else if(worst.key==="accent") fix=
    accCase==="none"?m("fix_acc_none",{base:A.loud,busy:accMean>A.baseMax,mean:accMean}):
    accCase==="over"?m("fix_acc_over",{cap:A.cap}):
    accCase==="base"?m("fix_acc_base",{mean:accMean,max:A.baseMax}):
    m("fix_accent",{base:A.loud});
  else if(worst.key==="chroma") fix=m("fix_chroma",{cat:loud.catName,name:loud.cname});
  else if(worst.key==="light") fix=allMid?m("fix_light_mid",{tgt:LT.good}):m("fix_light",{tgt:LT.good});
  else if(worst.key==="hue") fix=m("fix_hue");
  else if(worst.key==="temp") fix=tempPrefMiss?m("fix_temp_pref"):m("fix_temp");
  else fix=m(S.accent?"fix_shoe_sport":"fix_shoe");

  const verdict = total>=85?V.v1[L]:total>=70?V.v2[L]:total>=55?V.v3[L]:V.v4[L];
  return {items:its,rules,total,verdict,notes,fix,worstKey:worst.key,worstName:worst.name};
}

/* ===================== render helpers ===================== */
const VC={good:"var(--good)",warn:"var(--warn)",bad:"var(--bad)"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderPalette(el,onPick){
  el.innerHTML=PALETTE.map(g=>
    `<div class="pal-group${g.bright?" bright":""}"><div class="pal-label">${GROUPS[g.gi][L]}</div>`+
    (g.bright?`<div class="pal-note">${esc(UI.brightNote[L](ST().name[L]))}</div>`:"")+`<div class="pal-row">`+
    g.c.map(r=>`<div class="sw" data-hex="${r[0]}"><i style="background:${r[0]}"></i><span>${esc(cn(r[0]))}</span></div>`).join("")+
    `</div></div>`).join("");
  el.querySelectorAll(".sw").forEach(sw=>sw.onclick=()=>onPick(sw.dataset.hex,sw));
}
function lookHTML(its){
  return `<div class="look">`+its.map(i=>`
    <div class="look-row">
      <div class="look-col" style="background:${i.hex}"></div>
      <div class="look-txt">
        <div class="look-cat">${esc(i.catName)}</div>
        <div class="look-name">${esc(i.cname)}${i.name?` · ${esc(i.name)}`:""}${i.fabric?` <span class="look-num">/ ${esc(fab(i.fabric))}</span>`:""}</div>
        <div class="look-num">${i.hex.toUpperCase()} · L ${i.L} · C ${i.C} · H ${i.H}</div>
      </div>
    </div>`).join("")+`</div>`;
}
function resultHTML(res,withLook){
  if(!res) return `<div class="empty">${u("needTwo")}</div>`;
  return (withLook?lookHTML(res.items):"")+
   `<div class="score-head"><div class="score-num">${res.total}</div><div class="score-verdict">${esc(res.verdict)}</div></div><div>`+
   res.rules.map(x=>`<div class="rule">
      <div class="rule-top"><span class="dot" style="background:${VC[x.v]}"></span>
      <span class="rule-name">${esc(x.name)}</span>
      <span class="rule-w">${Math.round(x.ratio*100)}% · ${u("weight")} ${x.w}</span></div>
      <div class="rule-txt">${esc(x.txt)}</div></div>`).join("")+
   `</div><div class="fix"><b>${u("fixLabel")}</b>${esc(res.fix)}</div>`+
   (res.notes.length?`<div class="notes">`+res.notes.map(n=>`<div>· ${esc(n)}</div>`).join("")+`</div>`:"");
}

/* ===================== quick tab ===================== */
const quick={outer:null,top:null,bottom:null,shoe:null};
let activeSlot="top";

function drawSlots(){
  const el=document.getElementById("slots");
  el.innerHTML=CATS.map(c=>{
    const v=quick[c.k];
    const opt=(c.k==="outer"||c.k==="shoe")?`<span class="slot-opt">${u("optional")}</span>`:"";
    return `<div class="slot ${c.k===activeSlot?"active":""}" data-cat="${c.k}">
      <span class="chip" style="${v?`background:${v.hex};background-image:none`:""}"></span>
      <span class="slot-meta"><span class="slot-cat">${esc(c[L])} ${opt}</span><br>
      <span class="slot-col">${v?`${esc(cn(v.hex))} · ${v.hex.toUpperCase()}`:u("noColour")}</span></span>
      <select data-fab="${c.k}"><option value="">${u("fabricPH")}</option>${
        FABRICS.map(f=>`<option value="${f.k}" ${v&&v.fabric===f.k?"selected":""}>${esc(f[L])}</option>`).join("")}</select>
      ${v?`<button class="xbtn" data-del="${c.k}">&times;</button>`:""}</div>`;
  }).join("");
  el.querySelectorAll(".slot").forEach(s=>s.onclick=e=>{
    if(e.target.tagName==="SELECT"||e.target.dataset.del)return;
    activeSlot=s.dataset.cat; drawSlots();
  });
  el.querySelectorAll("[data-fab]").forEach(sel=>sel.onchange=()=>{
    const k=sel.dataset.fab; if(quick[k]){quick[k].fabric=sel.value; drawQuick();}
  });
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();quick[b.dataset.del]=null;drawSlots();drawQuick();});
}
/* ===================== schematic figure =====================
   one illustrated figure with the chosen colours filled in. it is deliberately neutral:
   proportions sit between a men's and a women's block, the cut is the same for everyone,
   and there is no skirt variant — the moment the drawing declares a gender it starts
   saying things about the wearer that the score has no opinion about.
   proportions are fashion-illustration proportions (long leg, small head) because he
   asked for a good-looking drawing rather than a mirror: the picture flatters, the score
   does not, and the score is the part that judges.
   everything is a curve, nothing is outlined, and volume comes from a five-stop gradient
   built out of the garment's own colour plus fold slivers and contact shadows.
   deliberately no clipPath and no blur filter: every shadow is placed by geometry we
   already know, so it renders the same in every engine. pure inline SVG — no images,
   no network, no cost. */
const SKIN="#D8D0C4", EMPTY="#E7E2D9", HAIR="#463F37";
const BODY={sh:23,w:17,h:22.3,hr:10.2,nk:5.8};
const SY=52, WY=112, HY=154, CY=166;   // shoulder / waist / hip / crotch lines
const FIGSTY={
 quiet:{top:{hem:134,sleeve:"long",neck:"crew"},bottom:{type:"straight",ankle:292},shoe:"loafer",outer:{hem:230}},
 french:{top:{hem:126,sleeve:"long",neck:"v"},bottom:{type:"straight",ankle:278},shoe:"loafer",outer:{hem:190}},
 urban:{top:{hem:144,sleeve:"long",neck:"crew"},bottom:{type:"wide",ankle:290},shoe:"boot",outer:{hem:246}},
 warm:{top:{hem:136,sleeve:"long",neck:"crew"},bottom:{type:"wide",ankle:288},shoe:"boot",outer:{hem:216}},
 sport:{top:{hem:128,sleeve:"short",neck:"crew"},bottom:{type:"jogger",ankle:286},shoe:"sneaker",outer:{hem:152}}
};
const LEGW={straight:[14,4.5],wide:[20,1],jogger:[12,4.5],legging:[10,3.5]};
// mix a colour toward white (pct>0) or black (pct<0). every derived tone — shading, folds,
// sole, lapel, facing — stays inside the chosen hue, so the figure never invents a colour
// the outfit does not contain
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16), t=pct<0?0:255, p=Math.abs(pct)/100;
  const v=[(n>>16)&255,(n>>8)&255,n&255].map(c=>Math.round(c+(t-c)*p));
  return "#"+v.map(c=>c.toString(16).padStart(2,"0")).join("");
}
function figSVG(){
  const B=BODY, cx=60, cfg=FIGSTY[STK]||FIGSTY.quiet;
  const bt=cfg.bottom, A=bt.ankle, hemT=cfg.top.hem;
  const N=v=>Math.round(v*10)/10, X=(s,v)=>N(cx+s*v);
  const lerp=(a,b,t)=>a+(b-a)*t;
  const defs=[], o=[];
  const P=(d,f,at)=>`<path d="${d}" fill="${f}"${at||""}/>`;
  const pg=(s,pts,f,at)=>P("M"+pts.map(p=>X(s,p[0])+","+p[1]).join(" L")+"Z",f,at);
  const col=k=>quick[k]?quick[k].hex:null;
  // five stops rather than three: a real cylinder keeps a rim light on its shadow side.
  // the range is capped (+15%/-22%) so the garment still reads as the colour he picked
  const vol=(k,hex)=>{
    const id=`fg-v-${k}`;
    defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2=".12">`+
      [[0,15],[.17,6],[.46,0],[.8,-12],[1,-22]].map(v=>
        `<stop offset="${v[0]}" stop-color="${shade(hex,v[1])}"/>`).join("")+`</linearGradient>`);
    return `url(#${id})`;
  };
  // contact shadow: where one layer sits on another, the lower one darkens right under the
  // edge and recovers within a few units. built as four flat slivers, each one a darker
  // mix of the cloth it lands on — no alpha and no gradient anywhere, so it renders the
  // same in every engine and can actually be checked in a headless rasteriser
  const STEPS=4;
  const occ=(y,h,w0,w1,hex,d0)=>{
    let out="";
    for(let i=0;i<STEPS;i++){
      const t0=i/STEPS, t1=(i+1)/STEPS, k=(1-t0)*(1-t0);
      out+=`<path d="M${X(-1,lerp(w0,w1,t0))},${N(y+h*t0)}L${X(1,lerp(w0,w1,t0))},${N(y+h*t0)}`
        +`L${X(1,lerp(w0,w1,t1))},${N(y+h*t1)}L${X(-1,lerp(w0,w1,t1))},${N(y+h*t1)}Z"`
        +` fill="${shade(hex,-d0*k)}"/>`;
    }
    return out;
  };
  const occS=(s,x0,x1,y,h,hex,d0)=>{   // the one-sided version, for shoes
    let out="";
    for(let i=0;i<STEPS;i++){
      const t0=i/STEPS, t1=(i+1)/STEPS, k=(1-t0)*(1-t0);
      out+=`<path d="M${X(s,x0)},${N(y+h*t0)}L${X(s,x1)},${N(y+h*t0)}`
        +`L${X(s,x1+.6)},${N(y+h*t1)}L${X(s,x0)},${N(y+h*t1)}Z" fill="${shade(hex,-d0*k)}"/>`;
    }
    return out;
  };
  // half-width of the bottom at a given height, so a shadow always lands on cloth
  const bwAt=y=>lerp(B.w,B.h+1,Math.min(1,(y-WY)/(HY+2-WY)));
  // a fold is a tapered sliver, the same hue as the cloth but d% darker
  const fold=(s,pts,hex,d)=>pg(s,pts,shade(hex,-(d||10)));

  /* ---- the figure underneath ---- */
  const la=10.5, lb=4, sk=vol("sk",SKIN);
  const body=`M${X(-1,B.sh)},${SY}`
   +`C${X(-1,B.sh+1)},${SY+22} ${X(-1,B.w+2)},${WY-18} ${X(-1,B.w)},${WY}`
   +`C${X(-1,B.w)},${WY+16} ${X(-1,B.h)},${HY-12} ${X(-1,B.h)},${HY}`
   +`C${X(-1,B.h)},${HY+50} ${X(-1,la+3)},${A-56} ${X(-1,la)},${A}`
   +`L${X(-1,lb)},${A}`
   +`C${X(-1,lb+1)},${A-56} ${X(-1,3)},${CY+40} ${X(-1,2.5)},${CY}`
   +`L${X(1,2.5)},${CY}`
   +`C${X(1,3)},${CY+40} ${X(1,lb+1)},${A-56} ${X(1,lb)},${A}`
   +`L${X(1,la)},${A}`
   +`C${X(1,la+3)},${A-56} ${X(1,B.h)},${HY+50} ${X(1,B.h)},${HY}`
   +`C${X(1,B.h)},${HY-12} ${X(1,B.w)},${WY+16} ${X(1,B.w)},${WY}`
   +`C${X(1,B.w+2)},${WY-18} ${X(1,B.sh+1)},${SY+22} ${X(1,B.sh)},${SY}Z`;
  const neck=`M${X(-1,B.nk-1.5)},30`
   +`C${X(-1,B.nk)},41 ${X(-1,B.nk+1)},47 ${X(-1,B.nk+2)},${SY+2}`
   +`L${X(1,B.nk+2)},${SY+2}`
   +`C${X(1,B.nk+1)},47 ${X(1,B.nk)},41 ${X(1,B.nk-1.5)},30Z`;
  const arm=(s,y2,wT,wB,out)=>`M${X(s,B.sh-1)},${SY}`
   +`C${X(s,B.sh+out)},${SY+26} ${X(s,B.sh+out+1)},${y2-42} ${X(s,B.sh+out)},${y2}`
   +`Q${X(s,B.sh+out-wB/2)},${y2+3} ${X(s,B.sh+out-wB)},${y2}`
   +`C${X(s,B.sh-wT+2)},${y2-42} ${X(s,B.sh-wT)},${SY+26} ${X(s,B.sh-wT)},${SY}Z`;
  const foot=s=>`M${X(s,3)},${A-1}`
   +`C${X(s,7)},${A-1} ${X(s,10)},${A+1} ${X(s,11.5)},${A+5}`
   +`Q${X(s,11.5)},${A+8} ${X(s,8)},${A+8}L${X(s,3)},${A+8}Z`;
  // the panel behind is white, so the contact shadow is just two flat warm greys
  o.push(`<ellipse cx="${cx}" cy="${A+12}" rx="${B.sh+5}" ry="4.6" fill="#F2F0EC"/>`
   +`<ellipse cx="${cx}" cy="${A+11.5}" rx="${B.sh-5}" ry="3" fill="#E8E5DF"/>`);
  o.push(P(neck,sk));
  o.push(`<ellipse cx="${cx}" cy="21" rx="${B.hr}" ry="12.8" fill="${sk}"/>`);
  // the jaw throws a shadow down the neck — the cheapest mark that says "this is lit"
  o.push(P(`M${X(-1,B.nk-1.5)},30Q${cx},38 ${X(1,B.nk-1.5)},30`
   +`L${X(1,B.nk-0.4)},37Q${cx},45 ${X(-1,B.nk-0.4)},37Z`,shade(SKIN,-7)));
  // hair: one neutral tone, ear length, no face. not a chooseable colour — hair is not
  // part of what we are scoring, and a strong cut would gender the figure
  const hr=B.hr;
  o.push(P(`M${X(-1,hr+1.1)},24C${X(-1,hr+1.6)},10 ${X(-1,5.5)},6.8 ${cx},6.8`
   +`C${X(1,5.5)},6.8 ${X(1,hr+1.6)},10 ${X(1,hr+1.1)},24`
   +`C${X(1,hr+.8)},29 ${X(1,hr-.4)},32 ${X(1,hr-2.4)},33`
   +`C${X(1,hr-3.4)},29 ${X(1,hr-3.2)},25 ${X(1,hr-4.2)},20`
   +`C${X(1,4)},15.8 ${X(-1,4)},15.8 ${X(-1,hr-4.2)},20`
   +`C${X(-1,hr-3.2)},25 ${X(-1,hr-3.4)},29 ${X(-1,hr-2.4)},33`
   +`C${X(-1,hr-.4)},32 ${X(-1,hr+.8)},29 ${X(-1,hr+1.1)},24Z`,HAIR));
  o.push(P(`M${X(-1,hr-1)},12.5C${X(-1,hr-3)},8.6 ${X(-1,2)},7.6 ${X(1,1)},9`
   +`C${X(-1,3)},10.6 ${X(-1,hr-4)},12.6 ${X(-1,hr-3.5)},17.5Z`,shade(HAIR,15)));
  o.push(P(body,sk));
  o.push(P(arm(-1,150,9,7,1.5),sk)+P(arm(1,150,9,7,1.5),sk));
  o.push(P(foot(-1),sk)+P(foot(1),sk));

  /* ---- bottom ---- */
  const cb=col("bottom"), cbs=cb||EMPTY, fb=vol("bt",cbs);
  const w=LEGW[bt.type]||LEGW.straight, oa=w[0], ia=w[1], kneeY=Math.round(lerp(HY,A,.48));
  o.push(P(`M${X(-1,B.w)},${WY}`
    +`C${X(-1,B.w)},${WY+16} ${X(-1,B.h+1)},${HY-10} ${X(-1,B.h+1)},${HY+2}`
    +`C${X(-1,B.h+1)},${HY+54} ${X(-1,oa+2)},${A-56} ${X(-1,oa)},${A}`
    +`L${X(-1,ia)},${A}`
    +`C${X(-1,ia+1)},${A-60} ${X(-1,3.5)},${CY+44} ${X(-1,3)},${CY+2}`
    +`L${X(1,3)},${CY+2}`
    +`C${X(1,3.5)},${CY+44} ${X(1,ia+1)},${A-60} ${X(1,ia)},${A}`
    +`L${X(1,oa)},${A}`
    +`C${X(1,oa+2)},${A-56} ${X(1,B.h+1)},${HY+54} ${X(1,B.h+1)},${HY+2}`
    +`C${X(1,B.h+1)},${HY-10} ${X(1,B.w)},${WY+16} ${X(1,B.w)},${WY}Z`,fb));
  // front crease, knee fold, hip fold: this is what turns a shape into cloth
  const mid=(oa+ia)/2;
  [-1,1].forEach(s=>{
    o.push(fold(s,[[mid+2.5,HY+16],[mid+3.4,HY+16],[mid+.6,A-2],[mid-.2,A-2]],cbs,7));
    o.push(fold(s,[[mid+4.2,kneeY],[mid-2.6,kneeY+3],[mid-2.4,kneeY+6.5],[mid+4.6,kneeY+3.5]],cbs,9));
    o.push(fold(s,[[B.h+.5,HY+4],[B.h-3.5,HY+3],[mid+1,HY+30],[mid+3.5,HY+26]],cbs,6));
  });
  if(bt.type==="jogger"&&cb){   // a cuff is what makes a jogger read as a jogger
    const cuff=[[ia-.5,A-9],[oa+.5,A-9],[oa,A],[ia,A]];
    o.push(pg(-1,cuff,shade(cbs,-13))+pg(1,cuff,shade(cbs,-13)));
  }

  /* ---- top, its sleeves, then the shadow it throws on the bottom ---- */
  const ct=col("top"), cts=ct||EMPTY, ft=vol("tp",cts), tw=B.w+3.5;
  o.push(P(`M${X(-1,B.sh)},${SY}`
   +`C${X(-1,B.sh+1)},${SY+24} ${X(-1,tw+1)},${WY-10} ${X(-1,tw)},${hemT}`
   +`Q${cx},${hemT+5} ${X(1,tw)},${hemT}`
   +`C${X(1,tw+1)},${WY-10} ${X(1,B.sh+1)},${SY+24} ${X(1,B.sh)},${SY}`
   +`Q${cx},${SY+12} ${X(-1,B.sh)},${SY}Z`,ft));
  // neckline: skin showing through, with the collar's own shadow sitting under it
  const nw=cfg.top.neck==="v"?6.5:7.8, nd=cfg.top.neck==="v"?SY+17:SY+12;
  o.push(P(`M${X(-1,nw)},${SY+1}Q${cx},${nd} ${X(1,nw)},${SY+1}Q${cx},${SY+4} ${X(-1,nw)},${SY+1}Z`,
    shade(SKIN,-5)));
  o.push(P(`M${X(-1,nw+.8)},${SY+1}Q${cx},${nd+3} ${X(1,nw+.8)},${SY+1}`
   +`L${X(1,nw)},${SY+1}Q${cx},${nd} ${X(-1,nw)},${SY+1}Z`,shade(cts,-11)));
  const sy=cfg.top.sleeve==="short"?92:147;
  o.push(P(arm(-1,sy,11,9,2.5),ft)+P(arm(1,sy,11,9,2.5),ft));
  [-1,1].forEach(s=>{   // shoulder seam, inner-elbow crease, a pull at the waist
    o.push(fold(s,[[B.sh-1,SY+1],[B.sh-9.5,SY+3],[B.sh-8.6,SY+5],[B.sh-1,SY+3.5]],cts,8));
    if(cfg.top.sleeve!=="short")
      o.push(fold(s,[[B.sh-7.5,118],[B.sh-2.5,121],[B.sh-2.6,124],[B.sh-7.8,121]],cts,8));
    o.push(fold(s,[[tw-1,hemT-26],[tw-5.5,hemT-30],[tw-6,hemT-26],[tw-1.2,hemT-22]],cts,6));
  });
  o.push(`<ellipse cx="${X(-1,B.sh-2)}" cy="153" rx="4.2" ry="5.4" fill="${SKIN}"/>`+
         `<ellipse cx="${X(1,B.sh-2)}" cy="153" rx="4.2" ry="5.4" fill="${SKIN}"/>`);
  o.push(occ(hemT,10,bwAt(hemT),bwAt(hemT+10),cbs,17));

  /* ---- shoes: optional, so a bare foot shows when nothing is chosen ---- */
  const cs=col("shoe");
  if(cs){
    const fs=vol("sh",cs);
    const shp={
      sneaker:s=>`M${X(s,2.5)},${A-5}L${X(s,11)},${A-5}`
        +`C${X(s,15)},${A-1} ${X(s,16.5)},${A+3} ${X(s,16)},${A+8}`
        +`Q${X(s,15.5)},${A+12} ${X(s,10)},${A+12}L${X(s,2.5)},${A+12}Z`,
      loafer:s=>`M${X(s,3)},${A-2}`
        +`C${X(s,7)},${A-3} ${X(s,10)},${A-1} ${X(s,13)},${A+2}`
        +`C${X(s,15)},${A+4} ${X(s,15)},${A+8} ${X(s,12)},${A+9}`
        +`L${X(s,3)},${A+9}Z`,
      boot:s=>`M${X(s,3)},${A-28}L${X(s,12)},${A-28}`
        +`C${X(s,13)},${A-10} ${X(s,14)},${A+1} ${X(s,14.5)},${A+6}`
        +`Q${X(s,14.5)},${A+10} ${X(s,10)},${A+10}L${X(s,3)},${A+10}Z`
    }[cfg.shoe];
    o.push(P(shp(-1),fs)+P(shp(1),fs));
    const top=cfg.shoe==="boot"?A-28:(cfg.shoe==="sneaker"?A-5:A-2);
    [-1,1].forEach(s=>{
      // the hem falls across the shoe, and the toe catches the light
      o.push(occS(s,3,12,top,6,cs,17));
      o.push(P(`M${X(s,7)},${top+3.5}C${X(s,11)},${top+3.5} ${X(s,13)},${top+5.5} ${X(s,13.4)},${top+8}`
        +`C${X(s,11)},${top+6.5} ${X(s,8.5)},${top+6} ${X(s,7)},${top+6}Z`,shade(cs,17)));
    });
    if(cfg.shoe==="sneaker"){   // a sole in a lighter tone of the same colour, not white
      const sole=s=>`M${X(s,2.5)},${A+7}L${X(s,16.2)},${A+6}`
        +`Q${X(s,15.5)},${A+12} ${X(s,10)},${A+12}L${X(s,2.5)},${A+12}Z`;
      o.push(P(sole(-1),shade(cs,22))+P(sole(1),shade(cs,22)));
    }
  }

  /* ---- outer: optional, last because it sits over everything ---- */
  const co=col("outer");
  if(co){
    const fo=vol("ot",co), h=cfg.outer.hem, inX=Math.max(B.w-3.5,8);
    o.push(P(arm(-1,144,12.5,10,3),fo)+P(arm(1,144,12.5,10,3),fo));
    // a yoke across the shoulders: without it the two front panels and the two sleeves
    // meet at a point and the coat grows little wings at the shoulder line
    o.push(P(`M${X(-1,B.sh+1.5)},${SY-1}Q${cx},${SY-8} ${X(1,B.sh+1.5)},${SY-1}`
     +`Q${cx},${SY+14} ${X(-1,B.sh+1.5)},${SY-1}Z`,fo));
    // the panels hang open and stay narrow: a coat that swallows the whole torso hides
    // the top, and the top is usually the piece the score is arguing about
    const panel=s=>`M${X(s,B.sh+1)},${SY-2}`
      +`C${X(s,B.sh+2)},${SY+26} ${X(s,B.w+4)},${WY-6} ${X(s,B.w+3)},${h}`
      +`Q${X(s,(B.w+3+inX)/2)},${h+5} ${X(s,inX)},${h}`
      +`C${X(s,inX+1)},${WY-20} ${X(s,13)},${SY+20} ${X(s,14.5)},${SY+1}Z`;
    o.push(P(panel(-1),fo)+P(panel(1),fo));
    [-1,1].forEach(s=>{   // folded facing along the open edge, plus two hanging folds
      o.push(fold(s,[[inX,h],[inX+1.8,h],[16.3,SY+4],[14.5,SY+2]],co,13));
      o.push(fold(s,[[B.sh-6,SY+30],[B.sh-10.5,SY+26],[B.sh-11,SY+31],[B.sh-6.4,SY+35]],co,7));
      o.push(fold(s,[[B.sh+1,138],[B.sh-8,141],[B.sh-8.2,144.5],[B.sh+1.4,141.5]],co,8));
    });
    const lap=[[B.sh-5,SY-2],[14.5,SY+1],[7,SY+26],[17,SY+4]];
    o.push(pg(-1,lap,shade(co,-11))+pg(1,lap,shade(co,-11)));
  }
  return `<svg viewBox="0 0 120 ${A+20}" role="img" aria-label="${esc(u("figAlt"))}">`+
    `<defs>${defs.join("")}</defs>${o.join("")}</svg>`;
}

/* ---- combination engine ---- */
// identity of a garment for rotation purposes: same category, colour, name and cloth is
// the same shirt twice over, and a second copy adds nothing to a colour plan
const ikey=i=>i.cat+"|"+i.hex+"|"+(i.name||"")+"|"+(i.fabric||"");
const CAP=3000;   // scoring is cheap but not free; a very large wardrobe gets truncated
// noPin: trip mode ignores the list's "pin" flag, because there the authority is the
// colour chips — pinning is a today-mode device meaning "I'm wearing this right now"
function allCombos(noPin){
  const byK=new Map();
  // a second copy of the same garment adds nothing, but if the copy is the one you pinned,
  // that's the one to keep
  ward.filter(i=>!i.skip).forEach(i=>{ const k=ikey(i), e=byK.get(k);
    if(!e||(i.pin&&!e.pin)) byK.set(k,i); });
  const live=[...byK.values()];
  const g=k=>{const a=live.filter(i=>i.cat===k), p=noPin?[]:a.filter(i=>i.pin);
    return {use:p.length?p:a, forced:p.length>0};};
  const T=g("top"), B=g("bottom"), O=g("outer"), S=g("shoe");
  if(!T.use.length||!B.use.length) return null;
  const outOpts=O.use.length?(O.forced?O.use:[null,...O.use]):[null];
  const shoeOpts=S.use.length?S.use:[null];
  const list=[]; let capped=false;
  scan:
  for(const t of T.use) for(const b of B.use) for(const o of outOpts) for(const s of shoeOpts){
    if(list.length>=CAP){capped=true;break scan;}
    const picks=[o,t,b,s].filter(Boolean);
    const res=scoreLook(picks.map(i=>({cat:i.cat,hex:i.hex,fabric:i.fabric||"",name:i.name||""})));
    if(res) list.push({res,o,t,b,s});
  }
  list.sort((a,b)=>b.res.total-a.res.total);
  return {list,capped};
}
// highest scoring outfits that don't reuse the same top or bottom
function pickDistinct(list,n){
  const out=[],ut=new Set(),ub=new Set();
  for(const c of list){ if(out.length>=n)break;
    const kt=ikey(c.t), kb=ikey(c.b);
    if(ut.has(kt)||ub.has(kb))continue;
    out.push(c); ut.add(kt); ub.add(kb);
  }
  for(const c of list){ if(out.length>=n)break; if(out.indexOf(c)<0)out.push(c); }
  return out;
}
// every subset of size n, with `must` (pinned pieces) always included. if the wardrobe
// can't supply n, it returns the biggest subset it can rather than nothing
function subsets(arr,n,must){
  const rest=arr.filter(x=>must.indexOf(x)<0);
  const need=Math.min(Math.max(0,n-must.length),rest.length);
  const out=[];
  (function rec(i,cur){
    if(cur.length===need){ out.push(must.concat(cur)); return; }
    if(i>=rest.length) return;
    rec(i+1,cur.concat([rest[i]])); rec(i+1,cur);
  })(0,[]);
  return out.length?out:[must.slice()];
}
// like pickDistinct, but every packed piece gets at least one day of its own first —
// a jacket you carried for three days and never wore is a planning failure, not a plan
function pickCovering(list,n,must){
  const out=[],ut=new Set(),ub=new Set();
  const take=c=>{out.push(c);ut.add(ikey(c.t));ub.add(ikey(c.b));};
  const free=c=>!ut.has(ikey(c.t))&&!ub.has(ikey(c.b));
  for(const mi of must){
    if(out.length>=n)break;
    const k=ikey(mi), hits=c=>[c.o,c.s].some(i=>i&&ikey(i)===k);
    // first choice is a day that repeats nothing; but with more days than bottoms you have
    // to repeat something anyway, and wearing the piece beats keeping the rotation clean
    const hit=list.find(c=>free(c)&&hits(c))||list.find(c=>out.indexOf(c)<0&&hits(c));
    if(hit) take(hit);
  }
  for(const c of list){ if(out.length>=n)break; if(out.indexOf(c)>=0)continue; if(free(c)) take(c); }
  for(const c of list){ if(out.length>=n)break; if(out.indexOf(c)<0) out.push(c); }
  return out.sort((a,b)=>b.res.total-a.res.total);
}
const SUBCAP=6;   // only the strongest few outers/shoes enter the subset search
const OKSCORE=70; // "成立" — a trip plan never offers a day below this
// the real constraint on a short trip isn't which outfit is best, it's what fits in the
// case: you commit to a couple of jackets and one or two pairs of shoes, and everything
// else has to work around them. so we choose the *packed set* first, then the outfits.
function tripPlan(list,days,nOut,nShoe,selO,selS,floor){
  const coll=k=>{
    const m=new Map();
    list.forEach(c=>{ const it=c[k]; if(!it)return; const key=ikey(it);
      const e=m.get(key); if(!e||c.res.total>e.best) m.set(key,{it,best:c.res.total}); });
    return [...m.values()].sort((a,b)=>b.best-a.best).map(x=>x.it);
  };
  const outers=coll("o"), shoes=coll("s");
  // what's committed to the case is exactly what the user picked by colour
  const must=(arr,keys)=>arr.filter(i=>(keys||[]).indexOf(ikey(i))>=0);
  const pinO=must(outers,selO), pinS=must(shoes,selS);
  const trim=(arr,must)=>{
    const keep=arr.filter(i=>must.indexOf(i)>=0);
    return keep.concat(arr.filter(i=>must.indexOf(i)<0)).slice(0,Math.max(SUBCAP,keep.length));
  };
  const oSets=(nOut<=0&&!pinO.length)?[[]]:subsets(trim(outers,pinO),Math.max(nOut,pinO.length),pinO);
  const sSets=shoes.length?subsets(trim(shoes,pinS),Math.max(nShoe,pinS.length),pinS):[[]];
  let best=null;
  for(const os of oSets) for(const ss of sSets){
    const ko=new Set(os.map(ikey)), ks=new Set(ss.map(ikey));
    // if a jacket is in the case it gets worn every day — that's what one jacket for a
    // short trip actually means. only "0 jackets" produces days without one
    // candidate days must clear the floor: a packing list is no place for a look you'd
    // regret. the piece lists above stay unfiltered so an explicit choice is never ignored
    const sub=list.filter(c=>(os.length?(c.o&&ko.has(ikey(c.o))):!c.o)&&(!c.s||ks.has(ikey(c.s))));
    const good=sub.filter(c=>c.res.total>=(floor||0));
    if(!good.length) continue;
    const pick=pickCovering(good,days,os.concat(ss));
    const used=new Set();
    pick.forEach(c=>[c.o,c.s].filter(Boolean).forEach(i=>used.add(ikey(i))));
    // a jacket that never gets worn is dead weight, so a set that uses everything it
    // packs beats an equally-scoring set that doesn't
    const allUsed=os.concat(ss).every(i=>used.has(ikey(i)));
    const sum=pick.reduce((s,c)=>s+c.res.total,0);
    const cand={pick,packO:os,packS:ss,n:pick.length,allUsed,avg:pick.length?sum/pick.length:0,
      rejected:sub.filter(c=>c.res.total<(floor||0))};
    if(!best||cand.n>best.n||(cand.n===best.n&&(cand.allUsed!==best.allUsed?cand.allUsed:cand.avg>best.avg)))
      best=cand;
  }
  return best;
}

/* ---- output ---- */
function comboCard(c,label){
  return `<div class="combo">
    <div class="combo-head">
      <span class="combo-bars">${c.res.items.map(i=>`<i style="background:${i.hex}"></i>`).join("")}</span>
      <span class="combo-title">${esc(label)} · ${c.res.items.map(i=>esc(i.cname)).join(" / ")}<br>
        <span class="look-num">${esc(c.res.verdict)}</span></span>
      <span class="combo-sc">${c.res.total}</span></div>
    <div class="combo-body">${resultHTML(c.res,true)}</div></div>`;
}
function rankRow(c){
  return `<div class="item">
    <span class="combo-bars" style="flex:0 0 auto">${c.res.items.map(i=>`<i style="background:${i.hex};width:20px;height:20px"></i>`).join("")}</span>
    <span class="nm" style="font-size:12.5px">${c.res.items.map(i=>esc(i.cname)).join(" / ")}<br>
      <span class="fb">${esc(c.res.fix)}</span></span>
    <span class="fb">${c.res.total}</span></div>`;
}
function bindOut(pick,labeller){
  const out=document.getElementById("w-out");
  out.querySelectorAll(".combo-head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  const cp=document.getElementById("cp");
  if(!cp)return;
  cp.textContent=u("copy");
  cp.onclick=()=>{
    const txt=`${ST().name[L]}\n\n`+pick.map((c,n)=>`${labeller(n+1)} (${c.res.total} · ${c.res.verdict})\n`+
      c.res.items.map(i=>`  ${i.catName}: ${i.cname} ${i.hex.toUpperCase()}${i.fabric?" / "+fab(i.fabric):""}`).join("\n")+
      `\n  ${u("suggestion")}: ${c.res.fix}`).join("\n\n");
    navigator.clipboard.writeText(txt).then(()=>cp.textContent=u("copied")).catch(()=>cp.textContent=u("copyFail"));
  };
}
function generate(){
  const out=document.getElementById("w-out"), got=allCombos(wmode==="trip");
  if(!got){ out.innerHTML=`<div class="panel"><div class="empty">${u("needTB")}</div></div>`; return; }
  const list=got.list, warn=got.capped?`<p class="hint">${u("tooMany")}</p>`:"";

  if(wmode==="today"){
    const pick=pickDistinct(list,3);
    out.innerHTML=`<div class="panel"><h2>${u("hToday")}</h2>
      <p class="hint">${UI.hintTop[L](list.length)}</p>${warn}
      ${pick.map((c,n)=>comboCard(c,UI.outfitN[L](n+1))).join("")}
      <div class="bar"><button class="act ghost" id="cp"></button></div></div>`;
    bindOut(pick,n=>UI.outfitN[L](n));

  } else if(wmode==="trip"){
    const days=+document.getElementById("w-days").value;
    const nOut=+document.getElementById("w-nouter").value;
    const nShoe=+document.getElementById("w-nshoe").value;
    const plan=tripPlan(list,days,nOut,nShoe,tripSel.outer,tripSel.shoe,OKSCORE);
    if(!plan||!plan.pick.length){
      out.innerHTML=`<div class="panel"><div class="empty">${u("noneGood")}</div></div>`; return; }
    const pick=plan.pick;
    const worn=new Set();
    pick.forEach(c=>[c.o,c.t,c.b,c.s].filter(Boolean).forEach(i=>worn.add(ikey(i))));
    const packed=[], seen=new Set();
    // the case holds what gets worn plus whatever was committed to up front
    pick.forEach(c=>[c.o,c.t,c.b,c.s].filter(Boolean).forEach(i=>{
      const k=ikey(i); if(!seen.has(k)){seen.add(k);packed.push(i);} }));
    plan.packO.concat(plan.packS).forEach(i=>{
      const k=ikey(i); if(!seen.has(k)){seen.add(k);packed.push(i);} });
    const nO=packed.filter(i=>i.cat==="outer").length, nS=packed.filter(i=>i.cat==="shoe").length;
    let shortMsg="";
    if(pick.length<days&&plan.rejected.length){
      // name the rule that keeps failing and the category that runs out first, so the
      // shortfall turns into one concrete thing to buy rather than a shrug
      const tally={};
      plan.rejected.forEach(c=>{ const k=c.res.worstName; tally[k]=(tally[k]||0)+1; });
      const worstName=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
      const dc=k=>new Set(ward.filter(i=>i.cat===k&&!i.skip).map(ikey)).size;
      const thin=dc("bottom")<=dc("top")?"bottom":"top";
      shortMsg=`<p class="short">${UI.shortDays[L](days,pick.length,worstName,cat(thin))}</p>`;
    }
    out.innerHTML=`<div class="panel"><h2>${UI.hDays[L](pick.length)}</h2>
      <p class="hint">${UI.hintDays[L](list.length,pick.length)}</p>${shortMsg}${warn}
      ${pick.map((c,n)=>comboCard(c,UI.dayN[L](n+1))).join("")}
      <div class="bar"><button class="act ghost" id="cp"></button></div></div>
      <div class="panel wsec"><h2>${u("hPack")}</h2>
      <p class="hint">${UI.hintPack[L](pick.length,nO,nS)}</p>
      <div class="pack">${CATS.map(c=>packed.filter(i=>i.cat===c.k).map(i=>
        `<div class="pkg"><i style="background:${i.hex}"></i><span>${esc(c[L])} · ${esc(cn(i.hex))}${
          i.fabric?" / "+esc(fab(i.fabric)):""}${worn.has(ikey(i))?"":` — ${esc(u("spare"))}`}</span></div>`
        ).join("")).join("")}</div>
      <p class="hint">${plan.allUsed?UI.packNote[L](pick.length,nO,nS):""}</p></div>`;
    bindOut(pick,n=>UI.dayN[L](n));

  } else {
    const good=list.filter(c=>c.res.total>=OKSCORE);
    const bad=list.slice(-6).reverse().filter(c=>c.res.total<OKSCORE);
    out.innerHTML=`<div class="panel"><h2>${UI.hRankGood[L](good.length)}</h2>${warn}
      ${good.length?`<div class="items">`+good.slice(0,60).map(rankRow).join("")+`</div>`
        :`<div class="empty">${u("noneGood")}</div>`}
      ${bad.length?`<div class="wsec"><h3>${u("hRankBad")}</h3></div>
        <div class="items lowlist">`+bad.map(rankRow).join("")+`</div>`:""}</div>`;
  }
  if(window.matchMedia("(max-width:880px)").matches)
    out.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ===================== language / boot ===================== */
function applyLang(){
  const S=ST(), sn=S.name[L];
  document.documentElement.lang = L==="zh"?"zh-Hant":L;
  document.title=UI.title[L](sn);
  const set=(id,v)=>document.getElementById(id).textContent=v;
  set("t-title",UI.title[L](sn)); set("t-sub",UI.sub[L](sn));
  set("t-style",u("styleLab")); set("t-blurb",S.blurb[L]);
  set("t-tab1",u("tab1")); set("t-tab2",u("tab2"));
  set("t-h-look",u("hLook")); set("t-hint-look",u("hintLook"));
  set("t-h-pal1",u("hPal"));
  set("t-h-fig",u("hFig")); set("t-fignote",UI.figNote[L]({st:sn}));
  set("t-h-build",u("hBuild")); set("t-hint-build",u("hintBuild"));
  set("t-h-list",u("hList")); set("t-days",u("days"));
  set("t-nouter",u("nOuterLab")); set("t-nshoe",u("nShoeLab"));
  set("t-sel-outer",u("selPick")); set("t-sel-shoe",u("selPick"));
  set("t-selnote",u("selNote"));
  set("t-method-s",u("methodS"));
  set("t-method-p",UI.methodP[L]({st:sn,c:S.chroma,l:S.light,w:S.w,prefer:S.temp.prefer,acc:S.accent||null,sh:S.shoe}));
  ["gen","demo","exp","imp","clr"].forEach(k=>document.getElementById("w-"+k).textContent=u(k));
  document.getElementById("styles").innerHTML=STYLES.map(s=>
    `<button data-st="${s.key}" class="${s.key===STK?"on":""}">${esc(s.name[L])}</button>`).join("");
  document.querySelectorAll("#styles button").forEach(b=>b.onclick=()=>{
    STK=b.dataset.st; try{localStorage.setItem("ql_style",STK);}catch(e){} applyLang();
  });
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  renderPalette(document.getElementById("pal-quick"),hex=>{
    quick[activeSlot]={hex,fabric:quick[activeSlot]?quick[activeSlot].fabric:""};
    const order=["top","bottom","outer","shoe"], nxt=order.find(k=>!quick[k]);
    if(nxt)activeSlot=nxt;
    drawSlots(); drawQuick();
  });
  // one tap on a colour puts the piece straight into the wardrobe — no confirm step
  renderPalette(document.getElementById("pal-ward"),(hex,sw)=>{
    const it=norm({cat:addCat,hex});
    ward.push(it); save(); drawCatPick(); drawWard(); showJust(it);
    sw.classList.add("added"); setTimeout(()=>sw.classList.remove("added"),450);
  });
  drawSlots(); drawQuick(); drawCatPick(); drawModes(); drawWard(); showJust(null);
  document.getElementById("w-out").innerHTML="";
}
document.querySelectorAll("#langs button").forEach(b=>b.onclick=()=>{
  L=b.dataset.l; try{localStorage.setItem("ql_lang",L);}catch(e){} applyLang();
});
document.getElementById("w-demo").onclick=()=>{
  if(ward.length&&!confirm(u("confirmDemo")))return;
  ward=SAMPLE.map(norm); save(); drawCatPick(); drawWard(); showJust(null);
  document.getElementById("w-out").innerHTML="";
};
document.getElementById("w-clr").onclick=()=>{ if(confirm(u("confirmClear"))){
  ward=[]; save(); drawCatPick(); drawWard(); showJust(null);
  document.getElementById("w-out").innerHTML=""; } };
document.getElementById("w-exp").onclick=()=>{
  const blob=new Blob([JSON.stringify(ward,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wardrobe.json";a.click();
};
document.getElementById("w-imp").onclick=()=>document.getElementById("w-file").click();
document.getElementById("w-file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);
    if(Array.isArray(d)){ ward=d.filter(i=>i&&i.hex&&i.cat).map(norm); save(); drawCatPick(); drawWard(); showJust(null); }
  }catch(err){ alert(u("readErr")); }};
  rd.readAsText(f);
};
document.getElementById("w-gen").onclick=generate;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  onQuickTab=t.dataset.tab==="quick";
  document.getElementById("tab-quick").classList.toggle("hide",!onQuickTab);
  document.getElementById("tab-ward").classList.toggle("hide",onQuickTab);
  drawQuick();
});
document.getElementById("mbar").onclick=()=>
  document.querySelector(".p-out").scrollIntoView({behavior:"smooth",block:"start"});
loadNums();   // days and counts survive a reload, like everything else here
applyLang();
</script>
