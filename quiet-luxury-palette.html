<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Luxury Colour Check</title>
<style>
  :root{
    color-scheme: light;
    --bg:#FAF8F4; --panel:#FFFFFF; --ink:#26241F; --ink-soft:#6E6A61;
    /* faint is for uppercase labels only: at #A49E93 it was ~2.6:1 on white, which
       fails WCAG even for large text. darkened to ~3.6:1, and every colour that carries
       an actual sentence now uses --ink-soft (~5:1) instead */
    --ink-faint:#8E887C; --line:#E3DED4; --accent:#8A7659;
    --good:#5C7A5E; --warn:#A8873F; --bad:#9C5A50;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Helvetica Neue",-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;
    font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 28px 90px}
  header{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px;
    display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
  .htext{flex:1;min-width:280px}
  h1{font-family:Georgia,"Songti TC","Noto Serif TC",serif;font-weight:400;font-size:30px;
     letter-spacing:.01em;margin:0 0 6px}
  .sub{color:var(--ink-soft);font-size:13.5px;max-width:660px;margin:0}
  .langs{display:flex;gap:1px;border:1px solid var(--line);background:#fff}
  .langs button{appearance:none;border:none;background:none;font-family:inherit;font-size:12px;
    letter-spacing:.06em;padding:7px 11px;cursor:pointer;color:var(--ink-faint)}
  .langs button.on{background:var(--ink);color:#fff}
  .langs button:not(.on):hover{color:var(--ink)}
  .tabs{display:flex;gap:2px;margin-bottom:26px;border-bottom:1px solid var(--line)}
  .tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;
    padding:10px 18px;font-size:14px;color:var(--ink-soft);cursor:pointer;font-family:inherit;letter-spacing:.02em}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--line);padding:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"slots out" "pal out";
    gap:26px;align-items:start}
  .p-slots{grid-area:slots} .p-out{grid-area:out} .p-pal{grid-area:pal}
  .pal-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 8px;max-width:480px}
  /* ---------- schematic figures ---------- */
  .figs{display:flex;justify-content:center;align-items:flex-end}
  .figs figure{margin:0;flex:0 1 178px;text-align:center}
  .figs svg{width:100%;height:auto;display:block}
  .figcap{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
  .fignote{font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin:14px 0 0}
  #mbar{display:none}
  h2{font-family:Georgia,"Songti TC",serif;font-weight:400;font-size:19px;margin:0 0 4px}
  h3{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 10px}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px}
  .slots{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
  .slot{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);
    background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .slot:hover{border-color:var(--ink-faint)}
  .slot.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .chip{width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(0,0,0,.14);
    background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),
    linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);
    background-size:10px 10px;background-position:0 0,5px 5px}
  .slot-meta{flex:1;min-width:0}
  .slot-cat{font-size:13.5px}
  .slot-col{font-size:12px;color:var(--ink-soft)}
  .slot-opt{font-size:11px;color:var(--ink-faint)}
  select,input[type=text]{font-family:inherit;font-size:12.5px;padding:5px 7px;
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:0}
  .xbtn{appearance:none;border:none;background:none;color:var(--ink-faint);cursor:pointer;
    font-size:16px;line-height:1;padding:4px 6px;font-family:inherit}
  .xbtn:hover{color:var(--bad)}
  .pal-group{margin-bottom:14px}
  .pal-label{font-size:11px;letter-spacing:.09em;color:var(--ink-faint);margin-bottom:6px;text-transform:uppercase}
  .pal-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
  .sw{cursor:pointer;text-align:center}
  .sw i{display:block;height:44px;border:1px solid rgba(0,0,0,.13)}
  .sw:hover i{outline:1px solid var(--accent);outline-offset:1px}
  .sw span{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:3px;line-height:1.3}
  .look{border:1px solid var(--line);background:#fff}
  .look-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
  .look-row:last-child{border-bottom:none}
  .look-col{width:132px;flex:0 0 132px}
  .look-txt{padding:10px 14px;flex:1;min-width:0}
  .look-cat{font-size:11px;letter-spacing:.09em;color:var(--ink-faint);text-transform:uppercase}
  .look-name{font-size:14px}
  .look-num{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .score-head{display:flex;align-items:baseline;gap:14px;margin:22px 0 4px}
  .score-num{font-family:Georgia,serif;font-size:44px;line-height:1}
  .score-verdict{font-size:14px;letter-spacing:.04em}
  .rule{border-top:1px solid var(--line);padding:11px 0}
  .rule-top{display:flex;align-items:center;gap:9px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .rule-name{font-size:13px;flex:1}
  .rule-w{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .rule-txt{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0 16px}
  .fix{background:#F5F1E9;border-left:2px solid var(--accent);padding:12px 14px;margin-top:18px;font-size:13px}
  .fix b{font-weight:600;letter-spacing:.06em;font-size:11px;text-transform:uppercase;
    color:var(--accent);display:block;margin-bottom:4px}
  .notes{margin-top:14px;font-size:12.5px;color:var(--ink-soft)}
  .notes div{padding:3px 0}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .items{border-top:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .item i{width:26px;height:26px;flex:0 0 26px;border:1px solid rgba(0,0,0,.14)}
  .item .nm{flex:1;min-width:0}
  .item .fb{font-size:11.5px;color:var(--ink-soft)}
  button.act{appearance:none;font-family:inherit;font-size:13px;letter-spacing:.03em;
    background:var(--ink);color:#fff;border:1px solid var(--ink);padding:8px 18px;cursor:pointer}
  button.act:hover{background:#000}
  button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
  button.ghost:hover{background:#F4F1EB}
  .combo{border:1px solid var(--line);background:#fff;margin-bottom:10px}
  .combo-head{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
  .combo-bars{display:flex;flex:0 0 auto}
  .combo-bars i{width:30px;height:30px;border:1px solid rgba(0,0,0,.12);border-right:none}
  .combo-bars i:last-child{border-right:1px solid rgba(0,0,0,.12)}
  .combo-title{flex:1;min-width:0;font-size:13px}
  .combo-sc{font-family:Georgia,serif;font-size:20px;font-variant-numeric:tabular-nums}
  .combo-body{display:none;border-top:1px solid var(--line);padding:16px 14px}
  .combo.open .combo-body{display:block}
  .empty{color:var(--ink-soft);font-size:13px;padding:18px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
  details.method{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
  details.method summary{cursor:pointer;font-size:13px;color:var(--ink-soft)}
  details.method p{font-size:12.5px;color:var(--ink-soft);max-width:780px}
  .hide{display:none}

  /* ---------- style selector ---------- */
  .stylerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 20px}
  .stylab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .styles{display:flex;flex-wrap:wrap;gap:1px;border:1px solid var(--line);background:#fff}
  .styles button{appearance:none;border:none;background:none;font-family:inherit;font-size:12.5px;
    padding:7px 13px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
  .styles button.on{background:var(--accent);color:#fff}
  .styles button:not(.on):hover{color:var(--ink)}
  .blurb{font-size:12px;color:var(--ink-soft);flex:1 1 300px;min-width:0;line-height:1.5}

  /* ---------- wardrobe ---------- */
  .wgrid{display:grid;grid-template-columns:1.1fr .9fr;
    grid-template-areas:"build list" "build gen" "out out";gap:22px;align-items:start}
  .p-build{grid-area:build} .p-list{grid-area:list} .p-gen{grid-area:gen}
  .wgrid .p-out{grid-area:out}
  .catpick,.modes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .catpick button,.modes button{appearance:none;font-family:inherit;font-size:12.5px;
    padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer}
  .catpick button:hover,.modes button:hover{border-color:var(--ink-faint);color:var(--ink)}
  .catpick button.on,.modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .catpick button .n{font-size:11px;opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
  .listhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .listhead h2{margin:0}
  .cnt{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .items{max-height:none}
  .item.off{opacity:.4}
  .item.pinned{box-shadow:inset 2px 0 0 var(--accent)}
  .item.pinned .nm{padding-left:7px}
  .ibtn{appearance:none;border:1px solid var(--line);background:#fff;font-family:inherit;
    font-size:10.5px;letter-spacing:.04em;padding:3px 7px;cursor:pointer;color:var(--ink-faint)}
  .ibtn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .ibtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .item select{font-size:11.5px;padding:3px 4px;max-width:112px}
  .dayslabel{font-size:12.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:7px}
  .dayslabel.hide{display:none}
  .selrow{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:0 0 9px}
  .sellab{font-size:12.5px;color:var(--ink-soft);flex:0 0 auto;padding-top:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 220px;min-width:0}
  .chip2{appearance:none;font-family:inherit;font-size:12px;background:#fff;border:1px solid var(--line);
    color:var(--ink-soft);padding:4px 9px 4px 5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip2 i{width:16px;height:16px;flex:0 0 16px;border:1px solid rgba(0,0,0,.14);display:block}
  .chip2:hover{border-color:var(--ink-faint);color:var(--ink)}
  .chip2.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
  .selnote{font-size:11.5px;color:var(--ink-soft);margin:2px 0 14px;max-width:620px}
  .selrow.hide,.selnote.hide{display:none}
  .short{background:#F5F1E9;border-left:2px solid var(--warn);padding:10px 13px;margin:0 0 14px;font-size:12.5px}
  .pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:4px}
  .pkg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 9px;font-size:12.5px}
  .pkg i{width:22px;height:22px;flex:0 0 22px;border:1px solid rgba(0,0,0,.14)}
  .pkg span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wsec{margin-top:18px}
  .lowlist{margin-top:6px}
  .justadd{font-size:12px;color:var(--ink-soft);min-height:22px;margin:-4px 0 12px;
    display:flex;gap:8px;align-items:center}
  .justadd i{width:16px;height:16px;flex:0 0 16px;border:1px solid rgba(0,0,0,.14)}
  .justadd button{appearance:none;border:none;background:none;font-family:inherit;font-size:12px;
    color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
  .sw.added i{outline:2px solid var(--accent);outline-offset:1px}

  /* ---------- mobile ---------- */
  @media(max-width:880px){
    .wrap{padding:22px 15px calc(74px + env(safe-area-inset-bottom))}
    header{gap:14px;padding-bottom:18px;margin-bottom:20px}
    h1{font-size:23px}
    .sub{font-size:12.5px}
    .langs{align-self:flex-start}
    .grid2{grid-template-columns:1fr;gap:16px}
    /* the loop is pick -> read -> pick again, so the colour card has to sit right under
       the four slots; the sticky bar carries the live score while you are up here */
    .qgrid{grid-template-columns:1fr;grid-template-areas:"slots" "pal" "out";gap:16px}
    .wgrid{grid-template-columns:1fr;grid-template-areas:"build" "list" "gen" "out";gap:16px}
    .stylerow{gap:8px;margin-bottom:14px}
    .styles{width:100%}
    .styles button{flex:1 1 30%;padding:8px 6px;font-size:12px}
    .blurb{flex:1 1 100%;font-size:11.5px}
    .catpick button,.modes button{flex:1 1 auto;padding:8px 10px;font-size:12px}
    .item select{max-width:none;flex:1 1 112px}
    .pack{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
    .panel{padding:16px 14px}
    .tabs{margin-bottom:18px}
    .tab{padding:9px 12px;font-size:13px;flex:1}
    .figs figure{flex:0 0 auto}
    .figs svg{width:auto;height:200px}
    .pal-row{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
    .sw i{height:40px}
    .sw span{font-size:9.5px}
    .look-col{width:74px;flex:0 0 74px}
    .look-txt{padding:8px 10px}
    .score-num{font-size:36px}
    .slot{flex-wrap:wrap;gap:9px;padding:8px 10px}
    .slot-meta{flex:1 1 120px}
    .chip{width:36px;height:36px;flex:0 0 36px}
    /* iOS Safari zooms the whole page when you focus a control smaller than 16px.
       the fix is the font size, not maximum-scale — locking zoom breaks accessibility */
    select,input[type=text],.item select{font-size:16px;padding:7px 8px;min-height:40px}
    .addrow input[type=text]{flex:1 1 110px;width:auto!important}
    .addrow select{flex:1 1 120px}
    button.act{padding:9px 14px;font-size:12.5px;flex:1 1 auto}
    .bar{gap:6px}
    .combo-head{flex-wrap:wrap;gap:8px;padding:10px}
    .combo-title{flex:1 1 100%;order:3}
    .combo-bars i{width:26px;height:26px}
    .combo-body{padding:12px 10px}
    .rule-txt{margin-left:0}
    details.method p{font-size:12px}
    /* live score follows you down the colour card */
    /* the home indicator on a notched iPhone sits on top of a plain bottom:0 bar,
       so the padding has to grow by the safe-area inset instead of being fixed */
    #mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;
      background:rgba(255,255,255,.97);border-top:1px solid var(--line);
      padding:7px 12px calc(7px + env(safe-area-inset-bottom));align-items:center;gap:10px;
      box-shadow:0 -2px 10px rgba(0,0,0,.05)}
    #mbar.show{display:flex}
    .mbar-chips{display:flex;flex:0 0 auto}
    .mbar-chips i{width:22px;height:30px;border:1px solid rgba(0,0,0,.12);border-right:none}
    .mbar-chips i:last-child{border-right:1px solid rgba(0,0,0,.12)}
    .mbar-txt{flex:1;min-width:0;font-size:11.5px;color:var(--ink-soft);line-height:1.3}
    #mbar-v{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* naming the weakest rule here is the whole point: you can keep picking colours at
       the top of the page and never scroll down to find out what is holding the score */
    .mbar-w{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;
      vertical-align:middle}
    .mbar-sc{font-family:Georgia,serif;font-size:22px;font-variant-numeric:tabular-nums}
  }
  @media(max-width:400px){
    .pal-row{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
    .sw i{height:36px}
    .look-col{width:60px;flex:0 0 60px}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="htext">
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
  </div>
  <div class="langs" id="langs">
    <button data-l="zh">中文</button><button data-l="en">EN</button>
    <button data-l="es">ES</button><button data-l="fr">FR</button>
  </div>
</header>

<div class="stylerow">
  <span class="stylab" id="t-style"></span>
  <div class="styles" id="styles"></div>
  <span class="blurb" id="t-blurb"></span>
</div>

<div class="tabs">
  <button class="tab on" data-tab="quick" id="t-tab1"></button>
  <button class="tab" data-tab="ward" id="t-tab2"></button>
</div>

<section id="tab-quick">
<div class="qgrid">
  <div class="panel p-slots">
    <h2 id="t-h-look"></h2>
    <p class="hint" id="t-hint-look"></p>
    <div class="slots" id="slots"></div>
    <h3 id="t-h-fig" style="margin-top:22px"></h3>
    <div class="figs" id="figs"></div>
    <p class="fignote" id="t-fignote"></p>
  </div>
  <div class="panel p-out" id="quick-out"></div>
  <div class="panel p-pal">
    <h3 id="t-h-pal1"></h3>
    <div id="pal-quick"></div>
  </div>
</div>
</section>

<section id="tab-ward" class="hide">
<div class="wgrid">
  <div class="panel p-build">
    <h2 id="t-h-build"></h2>
    <p class="hint" id="t-hint-build"></p>
    <div class="catpick" id="catpick"></div>
    <div class="justadd" id="w-just"></div>
    <div id="pal-ward"></div>
    <div class="bar">
      <button class="act ghost" id="w-demo"></button>
      <button class="act ghost" id="w-exp"></button>
      <button class="act ghost" id="w-imp"></button>
      <button class="act ghost" id="w-clr"></button>
    </div>
    <input type="file" id="w-file" accept=".json" class="hide">
  </div>
  <div class="panel p-list">
    <div class="listhead"><h2 id="t-h-list"></h2><span class="cnt" id="w-cnt"></span></div>
    <div class="items" id="w-items"></div>
  </div>
  <div class="panel p-gen">
    <div class="modes" id="modes"></div>
    <p class="hint" id="t-hint-mode"></p>
    <div class="selrow" id="row-days">
      <label class="dayslabel"><span id="t-days"></span>
        <select id="w-days"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>7</option></select>
      </label>
    </div>
    <div class="selrow" id="row-outer">
      <label class="dayslabel"><span id="t-nouter"></span>
        <select id="w-nouter"><option>0</option><option selected>1</option><option>2</option></select>
      </label>
      <span class="sellab" id="t-sel-outer"></span>
      <div class="chips" id="chips-outer"></div>
    </div>
    <div class="selrow" id="row-shoe">
      <label class="dayslabel"><span id="t-nshoe"></span>
        <select id="w-nshoe"><option selected>1</option><option>2</option></select>
      </label>
      <span class="sellab" id="t-sel-shoe"></span>
      <div class="chips" id="chips-shoe"></div>
    </div>
    <p class="selnote" id="t-selnote"></p>
    <div class="bar">
      <button class="act" id="w-gen"></button>
    </div>
  </div>
  <div class="p-out" id="w-out"></div>
</div>
</section>

<details class="method">
<summary id="t-method-s"></summary>
<p id="t-method-p"></p>
</details>
</div>
<div id="mbar"><div class="mbar-chips" id="mbar-chips"></div>
  <div class="mbar-txt"><span id="mbar-v"></span><span class="mbar-w" id="mbar-w"></span></div>
  <div class="mbar-sc" id="mbar-sc"></div></div>

<script>
"use strict";

/* ===================== i18n ===================== */
const LANGS=["zh","en","es","fr"];

 shortDays:{zh:(a,g,r,c)=>`你選了 ${a} 天,但在目前的條件下,這個衣櫃只排得出 ${g} 天 70 分以上的搭法,所以只列 ${g} 套——硬湊出來的那幾套不值得帶。排不進來的多半卡在「${r}」,要補就先補一件${c}。`,
   en:(a,g,r,c)=>`You asked for ${a} days, but under the current constraints this wardrobe only yields ${g} day${g===1?"":"s"} above 70, so ${g===1?"only one is":`only ${g} are`} listed — the rest would not be worth packing. What gets rejected mostly fails on ${r}, so the piece to add is another ${c.toLowerCase()}.`,
   es:(a,g,r,c)=>`Pediste ${a} días, pero con las condiciones actuales este armario solo da ${g} día${g===1?"":"s"} por encima de 70, así que ${g===1?"solo se lista uno":`solo se listan ${g}`}: el resto no merecería la maleta. Lo descartado falla sobre todo en ${r}, así que lo que falta es una prenda más de ${c.toLowerCase()}.`,

 hFig:{zh:"穿在身上的比例",en:"On the body",es:"Sobre el cuerpo",fr:"Sur le corps"},
 figAlt:{zh:"配色示意人形",en:"Colour layout figure",es:"Figura de referencia",fr:"Silhouette de référence"},
 figNote:{zh:p=>`人形刻意畫成中性,身形和版型都是「${p.st}」的固定示意,不是實際商品;顏色才是你選的。看這個是為了判斷面積——同一個顏色放在下身和放在鞋上,在身上完全是兩件事,色塊排排站看不出來。鞋和外套沒選就不會畫。`,
  en:p=>`The figure is deliberately neutral, and the cut is a fixed schematic for ${p.st} rather than a real garment; only the colours are yours. It is here to show area — the same colour on the trousers and on the shoes are two completely different things on a body, and a row of chips can't tell you that. Shoes and jacket are only drawn once chosen.`,
  es:p=>`La figura es deliberadamente neutra y el corte es un esquema fijo de ${p.st}, no una prenda real; solo los colores son tuyos. Está aquí para mostrar la superficie: el mismo color en el pantalón y en el zapato son dos cosas muy distintas sobre el cuerpo, y una fila de muestras no lo dice. El calzado y el abrigo solo se dibujan si los eliges.`,
  fr:p=>`La silhouette est volontairement neutre et la coupe est un schéma fixe pour ${p.st}, pas un vrai vêtement ; seules les couleurs sont les vôtres. Elle sert à montrer la surface : la même couleur sur le bas et sur la chaussure sont deux choses très différentes sur un corps, et une rangée de pastilles ne le dit pas. Chaussures et veste ne sont dessinées que si elles sont choisies.`},
 methodS:{zh:"判斷依據是什麼",en:"How the scoring works",es:"Cómo funciona la puntuación",fr:"Comment le calcul fonctionne"},
 methodP:{
  zh:p=>`所有顏色先從 sRGB 轉到 CIELAB,再取 LCH 的明度 L 與彩度 C。以下的數字是「${p.st}」這一組門檻,換風格數字就會換。${p.acc?`單一亮點:這個風格不設彩度上限,而是給一個亮點的額度——全身只有一件可以到 C ${p.acc.loud} 以上,那一件最高允許到 C ${p.acc.cap};藏青、橄欖、丹寧、鼠尾草這種沉調顏色在運動休閒裡算底色,不佔額度。兩件同時達標是硬扣分,完全沒有亮點則小扣,因為那偏居家服;當底的那幾件平均 C 超過 ${p.acc.baseMax} 也會打折,底要真的是底。`:`彩度:整套最高 C 值在 ${p.c.good} 以下最穩、${p.c.ok} 以內可接受、超過 ${p.c.high} 就離開這個風格的語彙;另外全套平均 C 超過 ${p.c.meanBad} 會再打折,因為那表示不只一件在說話。`}明度:最亮與最暗之差至少 ${p.l.good},低於 ${p.l.thin} 就算層次太薄,並避免每件都落在 L ${p.l.midLo}–${p.l.midHi} 的中間帶,那是糊掉的主因;鞋不算進這個跨度,免得白鞋憑空製造出對比。若全套最高彩度在 ${p.l.monoMaxC} 以下,同色調堆疊可以成立,但層次必須靠質料差異補回來。色相家族:C 值 10 以上算有彩色,色相相差 40 度內視為同家族,家族數超過 2 就超出範圍;若有兩個家族又沒有一件 C 8 以下的近無彩色當底,會再扣一次。冷暖:色相 115 度以下與 335 度以上算暖,150–310 度算冷,兩者同時出現時需要近無彩色橋接。${p.prefer?"這個風格另外以暖調為骨架,整套走冷會扣分。":"這個風格不偏好特定色溫,只要求一致。"}${p.acc?`鞋:有三條合格路徑——比上下身深而收束、成為全身唯一的亮點(C ${p.acc.loud} 以上)、或是 C ${p.sh.popC} 以下且 L ${p.sh.pop} 以上的乾淨淺色斷點(小白鞋走這條)。中間調的鞋才是這個風格真正的失分點。`:`鞋:明度應等於或低於上下身。`}質料層次為提示而非計分。分數是各規則的加權平均(${p.acc?"單一亮點":"彩度"} ${p.w.chroma}、明度 ${p.w.light}、色相 ${p.w.hue}、冷暖 ${p.w.temp}、鞋 ${p.w.shoe}),沒有鞋時該權重按比例分給其餘規則;另外任何一條嚴重不過,總分會被壓在 58 或 72 以下,避免一條大錯被四條小對平均掉。這是一套明確的規則判斷,不是品味的定論——規則說不行而你穿起來好看,以你為準。`,
  en:p=>`Every colour is converted from sRGB to CIELAB, then read as LCH lightness (L) and chroma (C). The numbers below belong to "${p.st}" and change with the style. ${p.acc?`Single accent: this style sets no chroma ceiling but a budget instead — exactly one piece may reach C ${p.acc.loud}, and that piece is allowed up to C ${p.acc.cap}. Muted colours like navy, olive, denim and sage count as base here and don't spend the budget. Two pieces over the line is a hard deduction; no accent at all takes a small one, because that reads as loungewear; and if the base pieces average above C ${p.acc.baseMax} the rule discounts too — the base has to actually be a base.`:`Chroma: the highest C in the outfit is safest below ${p.c.good}, acceptable up to ${p.c.ok}, and past ${p.c.high} it has left this style's vocabulary; an outfit-wide mean above ${p.c.meanBad} takes a further cut, because that means more than one piece is talking.`} Lightness: aim for at least ${p.l.good} between lightest and darkest, treat anything under ${p.l.thin} as thin layering, and avoid having every piece land in the L ${p.l.midLo}–${p.l.midHi} middle band, the main cause of a look going muddy; shoes are excluded from this span so white trainers can't invent contrast that the clothes don't have. If the outfit's highest chroma stays under ${p.l.monoMaxC}, tonal stacking is legitimate, but the layering then has to come from fabric. Hue families: C 10 and above counts as chromatic, hues within 40 degrees are one family, more than two is out of range, and two families with no near-neutral under C 8 underneath is penalised again. Warm/cool: hue up to 115 and above 335 reads warm, 150–310 reads cool, and both together need a near-neutral bridge. ${p.prefer?"This style is also built on warmth, so a fully cool outfit loses points.":"This style has no temperature preference — it only asks for consistency."} ${p.acc?`Shoes have three passing routes: darker than top and bottom, or the outfit's single accent (at or above C ${p.acc.loud}), or a clean light punctuation under C ${p.sh.popC} and above L ${p.sh.pop} — the white-trainer route. A mid-tone shoe is what actually loses points here.`:`Shoes should sit at or below the lightness of top and bottom.`} Fabric layering is advice, not scored. The total is a weighted average (${p.acc?"accent":"chroma"} ${p.w.chroma}, lightness ${p.w.light}, hue ${p.w.hue}, temperature ${p.w.temp}, shoes ${p.w.shoe}); with no shoes that weight is redistributed, and any badly failing rule caps the total at 58 or 72 so one real mistake can't be averaged away by four passes. This is an explicit rule check, not a verdict on taste — if a rule says no and it looks good on you, trust yourself.`,
  es:p=>`Cada color se convierte de sRGB a CIELAB y se lee como luminosidad (L) y croma (C) en LCH. Las cifras siguientes corresponden a "${p.st}" y cambian con el estilo. ${p.acc?`Acento único: este estilo no pone techo al croma, sino un presupuesto — solo una prenda puede llegar a C ${p.acc.loud}, y esa puede subir hasta C ${p.acc.cap}. Los colores apagados como marino, oliva, denim o salvia cuentan como base y no gastan el presupuesto. Dos prendas por encima es una penalización fuerte; ningún acento resta un poco, porque se lee como ropa de casa; y si las prendas de base promedian más de C ${p.acc.baseMax} también se descuenta: la base tiene que ser base.`:`Croma: el C más alto del conjunto es más seguro por debajo de ${p.c.good}, aceptable hasta ${p.c.ok}, y por encima de ${p.c.high} sale del vocabulario de este estilo; una media superior a ${p.c.meanBad} resta otra vez, porque significa que habla más de una prenda.`} Luminosidad: busca al menos ${p.l.good} entre la prenda más clara y la más oscura, por debajo de ${p.l.thin} la estratificación es débil, y evita que todas caigan en la banda media L ${p.l.midLo}–${p.l.midHi}. El calzado queda fuera de ese cálculo para que unas deportivas blancas no inventen un contraste que la ropa no tiene. Si el croma máximo se queda por debajo de ${p.l.monoMaxC}, el apilado tonal es válido, pero las capas deben venir del tejido. Familias de tono: desde C 10 es cromático, tonos a menos de 40 grados son una familia, más de dos queda fuera, y dos familias sin una prenda casi neutra por debajo de C 8 se penaliza otra vez. Cálido/frío: tono hasta 115 y por encima de 335 es cálido, 150–310 frío, y ambos juntos necesitan un puente neutro. ${p.prefer?"Este estilo se construye además sobre la calidez, así que un conjunto totalmente frío pierde puntos.":"Este estilo no prefiere ninguna temperatura, solo pide coherencia."} ${p.acc?`El calzado tiene tres vías de aprobado: más oscuro que arriba y abajo, ser el único acento del conjunto (a partir de C ${p.acc.loud}), o una puntuación clara y limpia por debajo de C ${p.sh.popC} y por encima de L ${p.sh.pop} — la vía de las deportivas blancas. Un zapato de tono medio es lo que de verdad resta aquí.`:`El calzado debe ser igual o más oscuro que arriba y abajo.`} La mezcla de tejidos es consejo, no puntúa. El total es una media ponderada (${p.acc?"acento":"croma"} ${p.w.chroma}, luminosidad ${p.w.light}, tono ${p.w.hue}, temperatura ${p.w.temp}, calzado ${p.w.shoe}); sin zapatos ese peso se redistribuye, y cualquier regla que falle claramente limita el total a 58 o 72, para que un error real no se diluya. Esto es una comprobación de reglas, no un veredicto sobre el gusto: si una regla dice que no y a ti te queda bien, hazte caso.`,
  fr:p=>`Chaque couleur est convertie du sRGB vers CIELAB, puis lue en LCH comme clarté (L) et chroma (C). Les chiffres ci-dessous appartiennent à « ${p.st} » et changent avec le style. ${p.acc?`Accent unique : ce style ne fixe pas de plafond de chroma mais un budget — une seule pièce peut atteindre C ${p.acc.loud}, et celle-là est autorisée jusqu'à C ${p.acc.cap}. Les couleurs sourdes — marine, olive, denim, sauge — comptent comme base et ne consomment pas le budget. Deux pièces au-dessus est une forte pénalité ; aucun accent en coûte un peu, car cela se lit comme un vêtement d'intérieur ; et si les pièces de base dépassent C ${p.acc.baseMax} en moyenne, il y a aussi une décote : la base doit rester une base.`:`Chroma : le C le plus élevé est le plus sûr sous ${p.c.good}, acceptable jusqu'à ${p.c.ok}, et au-delà de ${p.c.high} on sort du vocabulaire de ce style ; une moyenne supérieure à ${p.c.meanBad} pénalise encore, car cela signifie que plusieurs pièces parlent.`} Clarté : viser au moins ${p.l.good} d'écart, sous ${p.l.thin} la superposition est trop faible, et éviter que toutes les pièces tombent dans la bande médiane L ${p.l.midLo}–${p.l.midHi}. Les chaussures sont exclues de cet écart, pour qu'une paire blanche n'invente pas un contraste absent des vêtements. Si le chroma maximal reste sous ${p.l.monoMaxC}, l'empilement ton sur ton est valable, mais la superposition doit venir de la matière. Familles de teintes : à partir de C 10 une couleur est chromatique, des teintes séparées de moins de 40 degrés font une famille, plus de deux sort de la plage, et deux familles sans pièce quasi neutre sous C 8 sont pénalisées une seconde fois. Chaud/froid : teinte jusqu'à 115 et au-delà de 335 se lit chaude, 150–310 froide, et les deux ensemble exigent un pont neutre. ${p.prefer?"Ce style repose en outre sur la chaleur : une tenue entièrement froide perd des points.":"Ce style n'a pas de préférence de température, il demande seulement de la cohérence."} ${p.acc?`La chaussure a trois voies de réussite : plus foncée que le haut et le bas, être l'unique accent de la tenue (à partir de C ${p.acc.loud}), ou une ponctuation claire et nette sous C ${p.sh.popC} et au-dessus de L ${p.sh.pop} — la voie des baskets blanches. C'est la chaussure en demi-teinte qui fait réellement perdre des points ici.`:`Les chaussures doivent être d'une clarté égale ou inférieure au haut et au bas.`} La superposition des matières est un conseil, sans note. Le total est une moyenne pondérée (${p.acc?"accent":"chroma"} ${p.w.chroma}, clarté ${p.w.light}, teinte ${p.w.hue}, température ${p.w.temp}, chaussures ${p.w.shoe}) ; sans chaussures ce poids est redistribué, et toute règle nettement en échec plafonne le total à 58 ou 72, afin qu'une vraie erreur ne soit pas noyée. Il s'agit d'une vérification de règles, pas d'un verdict sur le goût — si une règle dit non et que cela vous va bien, faites-vous confiance.`}
};
